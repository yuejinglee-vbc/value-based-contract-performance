    </div>
  );
};

// ─── FINANCIAL DRILLDOWN ──────────────────────────────────────────
const EFFORT_COLOR = { Low:'#10b981', Medium:'#f59e0b', High:'#ef4444' };

const FinancialDrilldown = ({ c, T, onSelectLever }) => {
  const fin = getFinancials(c);
  const totalDiff = c.costTarget - c.costPMPM;
  const totalDiffPct = totalDiff / c.costTarget * 100;
  const annualVar = totalDiff * c.members * 12;
  const [expanded, setExpanded] = useState(null);
  const annualScale = c.members * 12;

  // Build focus areas: for each lever, estimate annual $ opportunity based on the
  // overage in its target subcategory (only count if subcategory is over target).
  const allLevers = [];
  fin.categories.forEach(cat => {
    const subs = getSubcategories(c, cat.name, cat.target, cat.actual);
    (LEVERS[cat.name] || []).forEach(lv => {
      const sub = subs.find(s => s.name === lv.target);
      if (!sub) return;
      const subOver = sub.actual - sub.target; // PMPM
      // Opportunity only meaningful if subcategory runs over target
      const oppPMPM = Math.max(0, subOver) * lv.capture;
      const oppAnnual = oppPMPM * annualScale;
      allLevers.push({ ...lv, category: cat.name, subOver, oppPMPM, oppAnnual });
    });
  });
  const focusAreas = [...allLevers].sort((a,b) => b.oppAnnual - a.oppAnnual).slice(0, 4);
  const totalOpp = focusAreas.reduce((s,l)=>s+l.oppAnnual, 0);

  const catTint = (over) => over ? '#fef2f2' : '#f0fdf4';

  return <div className="fade-in" style={{ flex:1, overflow:'auto', padding:22 }}>
    <div style={{ marginBottom:14 }}>
      <div style={{ fontSize:11, color:T.faint, fontWeight:600, textTransform:'uppercase', letterSpacing:0.5, marginBottom:4 }}>{c.name}</div>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-end' }}>
        <h1 style={{ fontSize:20, fontWeight:700, color:T.text }}>Cost by Service Category</h1>
        <div style={{ fontSize:12, color:T.muted }}>{c.period} · PMPM vs target</div>
      </div>
    </div>

    {/* KPIs */}
    <div style={{ display:'flex', gap:12, marginBottom:18 }}>
      <KPI label="Actual Cost PMPM"      value={`$${c.costPMPM}`}                                          sub={`Target: $${c.costTarget}`}                                  delta={totalDiffPct}                            accent={T.accent} T={T} />
      <KPI label="Target Cost PMPM"      value={`$${c.costTarget}`}                                        sub={`${fmtN(c.members)} attributed members`}                                                                     accent="#8b5cf6"  T={T} />
      <KPI label="Annual Variance"       value={fmtM(Math.abs(annualVar))}                                 sub={annualVar>=0?'Favorable to target':'Unfavorable to target'}                                                  accent={annualVar>=0?'#10b981':'#ef4444'} T={T} />
      <KPI label="Identified Opportunity" value={fmtM(totalOpp)}                                            sub={`${focusAreas.length} top operational levers`}                                                              accent="#3b82f6"  T={T} />
    </div>

    {/* Category breakdown — drillable */}
    <div style={{ background:T.cardBg, borderRadius:12, boxShadow:'0 1px 4px rgba(0,0,0,0.07)', overflow:'hidden', marginBottom:16 }}>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'16px 22px', borderBottom:`1px solid ${T.border}` }}>
        <div style={{ fontSize:14, fontWeight:700, color:T.text }}>Cost by Service Category (PMPM)</div>
        <div style={{ fontSize:11, color:T.faint }}>Click a row to drill into subcategories & applicable levers</div>
      </div>
      {fin.categories.map(cat => {
        const fav = cat.actual <= cat.target;
        const max = Math.max(cat.actual, cat.target) * 1.18;
        const isOpen = expanded === cat.name;
        const subs = getSubcategories(c, cat.name, cat.target, cat.actual);
        const catLevers = (LEVERS[cat.name] || []);
        const catAnnualVar = (cat.target - cat.actual) * annualScale;
        return <div key={cat.name} id={'cat-'+cat.name} style={{ borderBottom:`1px solid ${T.border}` }}>
          <div className="row-hover" onClick={()=>setExpanded(isOpen?null:cat.name)} style={{ padding:'16px 22px', cursor:'pointer' }}>
            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', gap:18 }}>
              <div style={{ display:'flex', alignItems:'center', gap:10, minWidth:170 }}>
                <span style={{ fontSize:11, color:T.faint, width:10, display:'inline-block', transform: isOpen?'rotate(90deg)':'rotate(0deg)', transition:'transform 0.15s' }}>▶</span>
                <span style={{ fontWeight:600, color:T.text, fontSize:14 }}>{cat.name}</span>
              </div>
              <div style={{ flex:1, position:'relative', height:10, background:'#e2e8f0', borderRadius:5 }}>
                <div className="bar-fill" style={{ height:'100%', width:`${cat.actual/max*100}%`, background:fav?'#10b981':'#ef4444', borderRadius:5, opacity:0.85 }} />
                <div style={{ position:'absolute', top:-3, left:`${cat.target/max*100}%`, width:2, height:16, background:'#334155' }} />
              </div>
              <div style={{ display:'flex', gap:18, alignItems:'baseline', minWidth:300, justifyContent:'flex-end' }}>
                <div style={{ fontSize:12, color:T.faint }}>Target <span style={{ color:T.text, fontWeight:600 }}>${cat.target}</span></div>
                <div style={{ fontSize:14, fontWeight:700, color:fav?'#059669':'#dc2626' }}>${cat.actual}</div>
                <div style={{ fontSize:12, fontWeight:600, color:fav?'#059669':'#dc2626', minWidth:90, textAlign:'right' }}>
                  {fav?'▼':'▲'} ${Math.abs(cat.target-cat.actual)}/pm
                </div>
              </div>
            </div>
          </div>
          {isOpen && <div style={{ background:catTint(!fav), padding:'18px 22px 22px 42px', borderTop:`1px solid ${T.border}` }}>
            {/* Subcategory table */}
            <div style={{ marginBottom:16 }}>
              <div style={{ fontSize:12, fontWeight:700, color:T.text, textTransform:'uppercase', letterSpacing:0.5, marginBottom:10 }}>Subcategory Breakdown</div>
              <div style={{ background:T.cardBg, borderRadius:10, overflow:'hidden', border:`1px solid ${T.border}` }}>
                <div style={{ display:'grid', gridTemplateColumns:'minmax(180px,2fr) 90px 90px 1fr 110px 110px', padding:'9px 16px', background:'#f8fafc', borderBottom:`1px solid ${T.border}` }}>
                  {['Subcategory','Target','Actual','vs Target','Variance /pm','Annual Impact'].map((h,i)=>
                    <div key={i} style={{ fontSize:10, fontWeight:700, color:T.faint, textTransform:'uppercase', letterSpacing:0.5, textAlign: i>=1?'right':'left' }}>{h}</div>)}
                </div>
                {subs.map(s => {
                  const over = s.actual > s.target;
                  const dv = s.actual - s.target;
                  const subMax = Math.max(s.actual, s.target) * 1.25;
                  const annualImpact = -dv * annualScale; // positive = saving
                  return <div key={s.name} style={{ display:'grid', gridTemplateColumns:'minmax(180px,2fr) 90px 90px 1fr 110px 110px', padding:'10px 16px', borderBottom:`1px solid ${T.border}`, alignItems:'center', fontSize:12 }}>
                    <div style={{ color:T.text, fontWeight:500 }}>{s.name}</div>
                    <div style={{ color:T.muted, textAlign:'right' }}>${s.target}</div>
                    <div style={{ color:T.text, fontWeight:700, textAlign:'right' }}>${s.actual}</div>
                    <div style={{ padding:'0 10px' }}>
                      <div style={{ position:'relative', height:6, background:'#e2e8f0', borderRadius:3 }}>
                        <div style={{ position:'absolute', top:0, left:0, height:'100%', width:`${s.actual/subMax*100}%`, background:over?'#ef4444':'#10b981', borderRadius:3, opacity:0.85 }} />
                        <div style={{ position:'absolute', top:-2, left:`${s.target/subMax*100}%`, width:1, height:10, background:'#334155' }} />
                      </div>
                    </div>
                    <div style={{ color:over?'#dc2626':'#059669', fontWeight:600, textAlign:'right' }}>{over?'+':''}${dv}</div>
                    <div style={{ color:annualImpact>=0?'#059669':'#dc2626', fontWeight:700, textAlign:'right' }}>{annualImpact>=0?'+':'−'}{fmtM(Math.abs(annualImpact))}</div>
                  </div>;
                })}
                <div style={{ display:'grid', gridTemplateColumns:'minmax(180px,2fr) 90px 90px 1fr 110px 110px', padding:'10px 16px', background:'#f8fafc', alignItems:'center', fontSize:12 }}>
                  <div style={{ color:T.text, fontWeight:700 }}>Total {cat.name}</div>
                  <div style={{ color:T.muted, textAlign:'right', fontWeight:700 }}>${cat.target}</div>
                  <div style={{ color:T.text, textAlign:'right', fontWeight:700 }}>${cat.actual}</div>
                  <div />
                  <div style={{ color:fav?'#059669':'#dc2626', fontWeight:700, textAlign:'right' }}>{fav?'':'+'}${cat.actual-cat.target}</div>
                  <div style={{ color:catAnnualVar>=0?'#059669':'#dc2626', fontWeight:700, textAlign:'right' }}>{catAnnualVar>=0?'+':'−'}{fmtM(Math.abs(catAnnualVar))}</div>
                </div>
              </div>
            </div>

            {/* Operational levers for this category */}
            <div>
              <div style={{ fontSize:12, fontWeight:700, color:T.text, textTransform:'uppercase', letterSpacing:0.5, marginBottom:10 }}>Operational Levers</div>
              <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(280px,1fr))', gap:10 }}>
                {catLevers.map((lv, i) => {
                  const sub = subs.find(s=>s.name===lv.target);
                  const oppPMPM = sub ? Math.max(0, sub.actual - sub.target) * lv.capture : 0;
                  const oppAnnual = oppPMPM * annualScale;
                  const hasOpp = oppAnnual > 0;
                  return <div key={i} className="row-hover" onClick={e=>{ e.stopPropagation(); onSelectLever && onSelectLever({ ...lv, category: cat.name }); }}
                    style={{ background:T.cardBg, border:`1px solid ${T.border}`, borderRadius:10, padding:'12px 14px', cursor:'pointer' }}>
                    <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', gap:8, marginBottom:6 }}>
                      <div style={{ fontSize:13, fontWeight:600, color:T.text }}>{lv.name}</div>
                      <div style={{ textAlign:'right', flexShrink:0 }}>
                        <div style={{ fontSize:14, fontWeight:700, color: hasOpp?'#059669':T.faint }}>{hasOpp ? fmtM(oppAnnual) : '—'}</div>
                        <div style={{ fontSize:10, color:T.faint }}>{hasOpp ? `$${oppPMPM.toFixed(0)}/pm` : 'at/below target'}</div>
                      </div>
                    </div>
                    <div style={{ fontSize:11, color:T.muted, lineHeight:1.45, marginBottom:8 }}>{lv.desc}</div>
                    <div style={{ display:'flex', gap:12, fontSize:11, paddingTop:6, borderTop:`1px dashed ${T.border}` }}>
                      <span style={{ color:T.faint }}>Targets <span style={{ color:T.text, fontWeight:600 }}>{lv.target}</span></span>
                      <span style={{ color:T.faint }}>Effort <span style={{ color:EFFORT_COLOR[lv.effort], fontWeight:600 }}>{lv.effort}</span></span>
                      <span style={{ color:T.faint }}>{lv.timeline}</span>
                      <span style={{ marginLeft:'auto', color:'#3b82f6', fontWeight:600 }}>Drilldown →</span>
                    </div>
                  </div>;
                })}
              </div>
            </div>
          </div>}
        </div>;
      })}
      {/* Total row */}
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'baseline', padding:'16px 22px', background:'#f8fafc' }}>
        <span style={{ fontWeight:700, fontSize:14, color:T.text }}>Total PMPM</span>
        <div style={{ display:'flex', gap:24, alignItems:'baseline' }}>
          <span style={{ fontSize:12, color:T.faint }}>Target ${c.costTarget}</span>
          <span style={{ fontSize:18, fontWeight:700, color:totalDiff>=0?'#059669':'#dc2626' }}>${c.costPMPM}</span>
          <span style={{ fontSize:12, fontWeight:600, color:totalDiff>=0?'#059669':'#dc2626' }}>{totalDiff>=0?'▼':'▲'} ${Math.abs(c.costTarget-c.costPMPM)}/pm</span>
        </div>
      </div>
    </div>
    {/* Focus Areas */}
    <div style={{ background:T.cardBg, borderRadius:12, padding:'18px 22px', boxShadow:'0 1px 4px rgba(0,0,0,0.07)', marginBottom:16, borderLeft:`3px solid #3b82f6` }}>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-end', marginBottom:14 }}>
        <div>
          <div style={{ fontSize:14, fontWeight:700, color:T.text }}>Focus Areas — Operational Levers</div>
          <div style={{ fontSize:12, color:T.muted, marginTop:2 }}>Highest-impact actions to close the gap to target, ranked by addressable savings.</div>
        </div>
        <div style={{ textAlign:'right' }}>
          <div style={{ fontSize:11, color:T.faint, fontWeight:600, textTransform:'uppercase', letterSpacing:0.5 }}>Total Addressable</div>
          <div style={{ fontSize:18, fontWeight:700, color:'#3b82f6' }}>{fmtM(totalOpp)}<span style={{ fontSize:11, color:T.faint, fontWeight:500, marginLeft:5 }}>annual</span></div>
        </div>
      </div>
      {focusAreas.length === 0 && <div style={{ fontSize:12, color:T.faint, fontStyle:'italic', padding:'8px 0' }}>All subcategories tracking at or below target — no major levers indicated.</div>}
      <div style={{ display:'grid', gridTemplateColumns:'repeat(2, 1fr)', gap:10 }}>
        {focusAreas.map((l, i) => {
          const isExpanded = expanded === l.category;
          return <div key={i} className="row-hover" onClick={()=>onSelectLever && onSelectLever(l)}
            style={{ border:`1px solid ${T.border}`, borderRadius:10, padding:'12px 14px', cursor:'pointer', background:'#fbfdff' }}>
            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', gap:10, marginBottom:6 }}>
              <div style={{ flex:1, minWidth:0 }}>
                <div style={{ display:'flex', gap:6, alignItems:'center', marginBottom:4 }}>
                  <span style={{ background:'#eff6ff', color:'#1d4ed8', fontSize:10, fontWeight:700, padding:'2px 7px', borderRadius:10, textTransform:'uppercase', letterSpacing:0.5 }}>{l.category}</span>
                  <span style={{ background:'#fef3c7', color:'#92400e', fontSize:10, fontWeight:700, padding:'2px 7px', borderRadius:10 }}>Rank #{i+1}</span>
                </div>
                <div style={{ fontSize:13, fontWeight:600, color:T.text, marginBottom:3 }}>{l.name}</div>
                <div style={{ fontSize:11, color:T.muted, lineHeight:1.45 }}>{l.desc}</div>
              </div>
              <div style={{ textAlign:'right', flexShrink:0 }}>
                <div style={{ fontSize:16, fontWeight:700, color:'#059669' }}>{fmtM(l.oppAnnual)}</div>
                <div style={{ fontSize:10, color:T.faint }}>${l.oppPMPM.toFixed(0)}/pm</div>
              </div>
            </div>
            <div style={{ display:'flex', gap:14, paddingTop:8, borderTop:`1px dashed ${T.border}`, fontSize:11 }}>
              <span style={{ color:T.faint }}>Effort: <span style={{ color:EFFORT_COLOR[l.effort], fontWeight:600 }}>{l.effort}</span></span>
              <span style={{ color:T.faint }}>Timeline: <span style={{ color:T.text, fontWeight:600 }}>{l.timeline}</span></span>
              <span style={{ marginLeft:'auto', color:'#3b82f6', fontWeight:600 }}>Investigate →</span>
            </div>
          </div>;
        })}
      </div>
    </div>

    {/* Provider-group risk-adjusted cost performance */}
    <ProviderGroupSection c={c} T={T} />

  </div>;
};

// ─── RISK ADJUSTMENT & CODING DRILLDOWN ───────────────────────────
const RiskCodingDrilldown = ({ c, T }) => {
  const mvmt = getRafMovement(c);
  const suspects = getSuspectConditions(c);
  const memberRows = getMemberRiskRows(c).sort((a,b) => a.rafChange - b.rafChange);
  const [memberView, setMemberView] = useState('drops'); // drops | suspects
  const [openHcc, setOpenHcc] = useState(null);           // expanded suspect HCC row
  const [dropFilter, setDropFilter] = useState('all');    // all | actionable | nosuspect

  const rafDelta = mvmt.rafCur - mvmt.rafPrior;
  const rafPct   = rafDelta / mvmt.rafPrior * 100;
  const totalDrop = mvmt.dropMajor + mvmt.dropMinor;
  const totalSuspect = suspects.reduce((s, h) => s + h.suspectMembers, 0);
  const totalOpp = suspects.reduce((s, h) => s + h.annualOpp, 0);
  const revAtRisk = rafDelta * mvmt.capPMPM * 12 * c.members; // negative when score dropped

  const buckets = [
    { key:'dropMajor', label:'Major drop', desc:'> 0.10 pts',     count:mvmt.dropMajor, color:'#dc2626', bg:'#fef2f2' },
    { key:'dropMinor', label:'Minor drop', desc:'0.01–0.10 pts',  count:mvmt.dropMinor, color:'#f59e0b', bg:'#fef3c7' },
    { key:'stable',    label:'Stable',     desc:'± 0.01 pts',     count:mvmt.stable,    color:'#94a3b8', bg:'#f1f5f9' },
    { key:'increased', label:'Increased',  desc:'> 0 pts',        count:mvmt.increased, color:'#10b981', bg:'#f0fdf4' },
  ];
  const maxC = Math.max(...buckets.map(b => b.count), 1);

  const dropsAll        = memberRows.filter(m => m.rafChange < 0);
  const dropsActionable = dropsAll.filter(m => m.hccs.length > 0);
  const memberDropRows  = (dropFilter === 'actionable' ? dropsActionable
                        : dropFilter === 'nosuspect'  ? dropsAll.filter(m => m.hccs.length === 0)
                        : dropsAll).slice(0, 8);
  const dropCounts = { all: dropsAll.length, actionable: dropsActionable.length, nosuspect: dropsAll.length - dropsActionable.length };
  const actionableRecapture = dropsActionable.reduce((s,m) => s + m.recaptureOpp, 0);
  const memberSuspectRows = memberRows.filter(m => m.hccs.length > 0).sort((a,b) => b.recaptureOpp - a.recaptureOpp).slice(0, 8);

  return <div className="fade-in" style={{ flex:1, overflow:'auto', padding:22 }}>
    {/* Header */}
    <div style={{ marginBottom:14 }}>
      <div style={{ fontSize:11, color:T.faint, fontWeight:600, textTransform:'uppercase', letterSpacing:0.5, marginBottom:4 }}>{c.name}</div>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-end' }}>
        <h1 style={{ fontSize:20, fontWeight:700, color:T.text }}>Risk Adjustment &amp; Coding</h1>
        <div style={{ fontSize:12, color:T.muted }}>{hccModelLabel(c)} · {c.period} · refreshed 7 days ago</div>
      </div>
    </div>

    {/* KPIs */}
    <div style={{ display:'flex', gap:12, marginBottom:18 }}>
      <KPI label="Avg RAF Score"          value={mvmt.rafCur.toFixed(3)} sub={`Prior ${mvmt.rafPrior.toFixed(3)} · ${rafPct>=0?'+':''}${rafPct.toFixed(2)}% YoY`} accent={rafDelta>=0?'#10b981':'#ef4444'} T={T} />
      <KPI label="Members w/ Score Drop"  value={fmtN(totalDrop)}        sub={`${(totalDrop/c.members*100).toFixed(0)}% of panel · YoY decrease`}                accent="#f59e0b" T={T} />
      <KPI label="Open Suspect HCCs"      value={fmtN(totalSuspect)}     sub={`Across ${suspects.length} HCC categories`}                                       accent="#8b5cf6" T={T} />
      <KPI label="Recapturable Revenue"   value={fmtM(totalOpp)}         sub="Annual · close suspect conditions"                                                accent="#10b981" T={T} />
    </div>

    {/* Net revenue impact callout */}
    <div style={{ background:T.cardBg, borderRadius:12, padding:'16px 22px', marginBottom:14, boxShadow:'0 1px 4px rgba(0,0,0,0.07)', borderLeft:`3px solid #8b5cf6` }}>
      <div style={{ display:'flex', alignItems:'center', gap:24, flexWrap:'wrap' }}>
        <div style={{ flex:1, minWidth:280 }}>
          <div style={{ fontSize:13, fontWeight:700, color:T.text, marginBottom:4 }}>Net annual revenue impact</div>
          <div style={{ fontSize:12, color:T.muted, lineHeight:1.5 }}>
            Panel-average RAF moved <strong style={{ color: rafDelta>=0?'#059669':'#dc2626' }}>{rafDelta>=0?'+':''}{rafDelta.toFixed(3)}</strong> year-over-year at ${mvmt.capPMPM}/pm capitation, equating to <strong>{revAtRisk>=0?'+':'−'}{fmtM(Math.abs(revAtRisk))}</strong> revenue. Estimated potential revenue impact if suspected conditions are clinically confirmed, appropriately documented, and eligible for risk adjustment is <strong style={{ color:'#059669' }}>+{fmtM(totalOpp)}</strong>.
          </div>
        </div>
        <div style={{ display:'flex', gap:14, alignItems:'center' }}>
          <div style={{ textAlign:'right' }}>
            <div style={{ fontSize:10, color:T.faint, fontWeight:700, textTransform:'uppercase', letterSpacing:0.5 }}>At risk</div>
            <div style={{ fontSize:18, fontWeight:700, color: revAtRisk>=0?'#059669':'#dc2626' }}>{revAtRisk>=0?'+':'−'}{fmtM(Math.abs(revAtRisk))}</div>
          </div>
          <div style={{ fontSize:18, color:T.faint }}>+</div>
          <div style={{ textAlign:'right' }}>
            <div style={{ fontSize:10, color:T.faint, fontWeight:700, textTransform:'uppercase', letterSpacing:0.5 }}>Recapture</div>
            <div style={{ fontSize:18, fontWeight:700, color:'#059669' }}>+{fmtM(totalOpp)}</div>
          </div>
          <div style={{ fontSize:18, color:T.faint }}>=</div>
          <div style={{ background:(totalOpp+revAtRisk)>=0?'#dcfce7':'#fee2e2', borderRadius:9, padding:'9px 14px', textAlign:'right' }}>
            <div style={{ fontSize:10, color:(totalOpp+revAtRisk)>=0?'#065f46':'#991b1b', fontWeight:700, textTransform:'uppercase', letterSpacing:0.5 }}>Net</div>
            <div style={{ fontSize:20, fontWeight:700, color:(totalOpp+revAtRisk)>=0?'#065f46':'#991b1b' }}>{(totalOpp+revAtRisk)>=0?'+':'−'}{fmtM(Math.abs(totalOpp+revAtRisk))}</div>
          </div>
        </div>
      </div>
    </div>

    {/* Movement + Member-level drilldown */}
    <div style={{ display:'grid', gridTemplateColumns:'1fr 1.3fr', gap:14, marginBottom:14 }}>
      {/* Risk Score Movement */}
      <div style={{ background:T.cardBg, borderRadius:12, padding:'18px 22px', boxShadow:'0 1px 4px rgba(0,0,0,0.07)' }}>
        <div style={{ display:'flex', justifyContent:'space-between', marginBottom:14, alignItems:'baseline' }}>
          <div style={{ fontSize:13, fontWeight:700, color:T.text, textTransform:'uppercase', letterSpacing:0.5 }}>Risk Score Movement (YoY)</div>
          <div style={{ fontSize:11, color:T.faint }}>{fmtN(c.members)} members</div>
        </div>
        <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
          {buckets.map(b => {
            const pct = b.count / c.members * 100;
            const w = b.count / maxC * 100;
            return <div key={b.key}>
              <div style={{ display:'flex', justifyContent:'space-between', alignItems:'baseline', marginBottom:5 }}>
                <div style={{ fontSize:12, color:T.text, fontWeight:600 }}>{b.label} <span style={{ color:T.faint, fontWeight:400 }}>· {b.desc}</span></div>
                <div style={{ fontSize:12, fontWeight:700, color:b.color }}>{fmtN(b.count)} <span style={{ color:T.faint, fontWeight:400, fontSize:11 }}>({pct.toFixed(0)}%)</span></div>
              </div>
              <div style={{ height:11, background:b.bg, borderRadius:5, overflow:'hidden' }}>
                <div className="bar-fill" style={{ height:'100%', width:`${w}%`, background:b.color, borderRadius:5 }} />
              </div>
            </div>;
          })}
        </div>
        <div style={{ marginTop:14, padding:'10px 12px', background:T.bg, borderRadius:8, fontSize:11, color:T.muted, lineHeight:1.5 }}>
          <strong style={{ color:T.text }}>{fmtN(totalDrop)} members</strong> ({(totalDrop/c.members*100).toFixed(0)}%) saw a YoY RAF decrease. At ${mvmt.capPMPM}/pm capitation, this represents the bulk of the revenue erosion shown above.
        </div>
      </div>

      {/* Member-level table with toggle */}
      <div style={{ background:T.cardBg, borderRadius:12, padding:'18px 22px', boxShadow:'0 1px 4px rgba(0,0,0,0.07)' }}>
        <div style={{ display:'flex', justifyContent:'space-between', marginBottom:12, alignItems:'center' }}>
          <div style={{ fontSize:13, fontWeight:700, color:T.text, textTransform:'uppercase', letterSpacing:0.5 }}>Member-Level View</div>
          <div style={{ display:'flex', gap:4, background:T.bg, borderRadius:7, padding:2 }}>
            {[['drops','Top Score Drops'],['suspects','Open Suspects']].map(([k,l]) => (
              <button key={k} className="btn-base" onClick={()=>setMemberView(k)} style={{ padding:'5px 12px', borderRadius:5, fontSize:11, fontWeight:600, background:memberView===k?T.cardBg:'transparent', color:memberView===k?T.text:T.muted, border:'none', boxShadow:memberView===k?'0 1px 2px rgba(0,0,0,0.08)':'none' }}>{l}</button>
            ))}
          </div>
        </div>
        {memberView === 'drops' ? <>
          <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:10, flexWrap:'wrap' }}>
            {[['all','All drops'],['actionable','Has open suspect'],['nosuspect','No suspect on file']].map(([k,l]) => (
              <button key={k} className="btn-base" onClick={()=>setDropFilter(k)} style={{ padding:'4px 11px', borderRadius:12, fontSize:11, fontWeight:600, background: dropFilter===k?'#7c3aed':T.bg, color: dropFilter===k?'#fff':T.muted, border:`1px solid ${dropFilter===k?'#7c3aed':T.border}` }}>
                {l} <span style={{ opacity:0.7 }}>{fmtN(dropCounts[k])}</span>
              </button>
            ))}

const computeRowMetrics = (row, contracts) => {
  const vals = contracts.map(row.get).map(v => typeof v === 'number' ? v : 0);
  const bench = row.bench ? row.bench(contracts) : (CONTRACTS.reduce((s,c)=>s+(typeof row.get(c)==='number'?row.get(c):0),0) / CONTRACTS.length);
  const numericVals = vals.filter(v => Number.isFinite(v));
  const max = Math.max(...numericVals, Number.isFinite(bench) ? bench : -Infinity);
  const min = Math.min(...numericVals, Number.isFinite(bench) ? bench : Infinity);
  const maxAbsDelta = Number.isFinite(bench)
    ? Math.max(...numericVals.map(v => Math.abs(v - bench)), 0.0001)
    : 0;
  let bestIdx = -1, worstIdx = -1;
  if (row.dir !== 0 && contracts.length > 1) {
    const target = row.dir === 1 ? Math.max(...vals) : Math.min(...vals);
    const anti   = row.dir === 1 ? Math.min(...vals) : Math.max(...vals);
    if (target !== anti) {
      bestIdx = vals.findIndex(v => v === target);
      worstIdx = vals.findIndex(v => v === anti);
    }
  }
  return { vals, bench, max, min, maxAbsDelta, bestIdx, worstIdx };
};

const getLeverMembers = (c, lever, count=64) => {
  const meta = getLeverMeta(lever);
  const baseRaf = (RISK_PROFILE[c.id] || {}).rafCur || 1.0;
  const members = [];
  for (let i=0; i<count; i++) {
    const seed = hash(c.id+':lvr:'+(lever?.name || '_')+':'+i);
    const fn = FIRST_NAMES[seed % FIRST_NAMES.length];
    const ln = LAST_NAMES[(seed >> 8) % LAST_NAMES.length];
    const memberId = 'M' + (10000 + (seed % 89999));
    const lRoll = (seed >> 5) % 100;
    const likelihood = +Math.max(0.32, Math.min(0.98, 0.42 + (lRoll / 100) * 0.55)).toFixed(2);
    const visits6mo = ((seed >> 12) % 6) + (likelihood > 0.75 ? 2 : 0);
    const avoidable = Math.min(visits6mo, Math.max(0, Math.floor(visits6mo * (0.4 + ((seed >> 16) % 50) / 100))));
    const projectedSpend = Math.round(visits6mo * 2 * (650 + ((seed >> 18) % 700)));
    const lastEdDaysRaw = 3 + ((seed >> 20) % 80);
    const lastEdDays = visits6mo > 0 ? lastEdDaysRaw : null;
    const riskScore = +(baseRaf + (((seed >> 22) % 100) / 100 - 0.5) * 0.7).toFixed(2);
    const numReasons = 1 + ((seed >> 24) % 3);
    // Utilization-derived criteria may only be assigned when the member's own
    // encounter data actually satisfies the rule (keeps the drilldown auditable).
    const afterHoursEligible = visits6mo >= 2 ? 2 + ((seed >> 26) % 2) : 0;
    const ELIGIBLE = {
      freq:      visits6mo >= 3,
      low_acu:   visits6mo > 0 && (avoidable / visits6mo) >= 0.5,
      after_hr:  visits6mo >= 2,
      recent:    visits6mo > 0 && lastEdDays <= 60,
    };
    const pool = meta.reasonFlags.filter(f => ELIGIBLE[f.id] !== false);
    const flags = [];
    for (let j=0; j<pool.length*3 && flags.length<Math.min(numReasons, pool.length); j++) {
      const f = pool[((seed >> (j * 3 + 5)) % pool.length)];
      if (!flags.find(x => x.id === f.id)) flags.push(f);
    }
    const afterHoursCount = flags.some(f => f.id === 'after_hr') ? Math.min(visits6mo, afterHoursEligible) : 0;
    const practiceIdx = (seed >> 9) % PG_NAMES.length;
    const practice = PG_NAMES[practiceIdx][0];
    const cmRoll = (seed >> 28) % 10;
    const careMgr = cmRoll < 3 ? CARE_MGRS[cmRoll % CARE_MGRS.length] : null;
    members.push({ id:memberId, name:fn+' '+ln, likelihood, visits6mo, avoidable, projectedSpend, lastEdDays, afterHoursCount, riskScore, flags, practice, careMgr });
  }
  return members.sort((a,b) => b.likelihood - a.likelihood);
};

const getLeverPractices = (c, lever) => {
  const meta = getLeverMeta(lever);
  const capture = lever?.capture || 0.14;
  const groups = getProviderGroups(c);
  return groups.map((g,i) => {
    const seed = hash(c.id+':lvp:'+(lever?.name || '_')+':'+i);
    const metricVal = Math.round(135 + (seed % 110) - 25);
    const avoidablePct = +((38 + ((seed >> 6) % 32)) / 100).toFixed(2);
    const annualVisits = Math.round(metricVal * g.panel / 1000);
    const annualAvoidable = Math.round(annualVisits * avoidablePct);
    const opp = annualAvoidable * meta.visitUnitCost * capture;
    return { ...g, metricVal, avoidablePct, annualVisits, annualAvoidable, opp };
  }).sort((a,b) => b.opp - a.opp);
};

        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-end', marginBottom:14 }}>
          <div>

            <div style={{ fontSize:12, color:T.muted, marginTop:2 }}>In-flight, queued, and draft outreach.</div>

        </div>

              <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:6 }}>
                <div style={{ fontSize:13, fontWeight:600, color:T.text }}>{camp.name}</div>
                <span style={{ background:`${camp.statusColor}22`, color:camp.statusColor, fontSize:10, fontWeight:700, padding:'2px 8px', borderRadius:10 }}>● {camp.status}</span>
              </div>
              <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:6 }}>
                <div style={{ flex:1, height:5, background:'#e2e8f0', borderRadius:3, position:'relative' }}>
                  <div style={{ position:'absolute', top:0, left:0, height:'100%', width:`${camp.target?Math.min(100, camp.enrolled/camp.target*100):0}%`, background: camp.statusColor, borderRadius:3 }} />
                </div>
                <span style={{ fontSize:11, fontWeight:600, color:T.text, whiteSpace:'nowrap' }}>{fmtN(camp.enrolled)} / {fmtN(camp.target)}</span>
              </div>
              <div style={{ display:'flex', gap:10, paddingTop:6, borderTop:`1px dashed ${T.border}`, fontSize:11, flexWrap:'wrap' }}>
                <span style={{ color:T.faint }}>{camp.startDate} → {camp.endDate}</span>
                <span style={{ marginLeft:'auto', color:T.muted }}>{camp.owner}</span>
              </div>
              <div style={{ marginTop:5, fontSize:11, color:'#059669', fontWeight:600 }}>{camp.kpi}</div>
            </div>
          ))}
        </div>
      </div>
    </div>

    {/* Bulk action modal */}
    {bulkAction && (
      <div onClick={()=>setBulkAction(null)} style={{ position:'fixed', inset:0, background:'rgba(15,23,42,0.5)', display:'flex', alignItems:'center', justifyContent:'center', zIndex:1000 }}>
        <div onClick={e=>e.stopPropagation()} className="slide-up" style={{ background:T.cardBg, borderRadius:12, padding:'24px 28px', minWidth:440, maxWidth:520, boxShadow:'0 20px 50px rgba(0,0,0,0.3)' }}>
          {bulkAction==='assign' ? <>
            <div style={{ fontSize:18, fontWeight:700, color:T.text, marginBottom:6 }}>Assign care manager</div>
            <div style={{ fontSize:13, color:T.muted, marginBottom:18 }}>{selected.size} member{selected.size===1?'':'s'} will be assigned for ongoing outreach and care coordination.</div>
            <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
              {CARE_MGRS.map(cm => (
                <button key={cm} className="btn-base" onClick={()=>{ setSnack({ kind:'assign', who:cm, n:selected.size }); setBulkAction(null); setSelected(new Set()); }}
                  style={{ background:T.bg, border:`1px solid ${T.border}`, padding:'11px 14px', borderRadius:8, textAlign:'left', fontSize:13, color:T.text, fontWeight:500, display:'flex', justifyContent:'space-between', alignItems:'center' }}>
                  <span>{cm}</span>
                  <span style={{ fontSize:11, color:T.faint }}>Assign →</span>
                </button>
              ))}
            </div>
          </> : <>
            <div style={{ fontSize:18, fontWeight:700, color:T.text, marginBottom:6 }}>Enroll in campaign</div>
            <div style={{ fontSize:13, color:T.muted, marginBottom:18 }}>{selected.size} member{selected.size===1?'':'s'} will be enrolled in the selected outreach campaign.</div>
            <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
              {meta.campaigns.map(camp => (
                <button key={camp.id} className="btn-base" onClick={()=>{ setSnack({ kind:'campaign', who:camp.name, n:selected.size }); setBulkAction(null); setSelected(new Set()); }}

                  <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center' }}>
                    <span>{camp.name}</span>
                    <span style={{ fontSize:11, color:camp.statusColor, fontWeight:700 }}>● {camp.status}</span>
                  </div>

    {/* Snackbar */}
    {snack && (
      <div className="slide-up" style={{ position:'fixed', bottom:24, left:'50%', transform:'translateX(-50%)', background:'#059669', color:'#fff', padding:'12px 20px', borderRadius:10, boxShadow:'0 10px 30px rgba(0,0,0,0.25)', fontSize:13, fontWeight:600, display:'flex', alignItems:'center', gap:10, zIndex:999 }}>
        <span>✓</span>
        <span>{snack.n} member{snack.n===1?'':'s'} {snack.kind==='assign' ? `assigned to ${snack.who}` : `enrolled in ${snack.who}`}</span>
        <button onClick={()=>setSnack(null)} style={{ background:'transparent', color:'#fff', border:'none', cursor:'pointer', marginLeft:8, fontSize:14 }}>✕</button>
      </div>
    )}
  </div>;
};

const ContractComparison = ({ contracts, setContracts, onClose, onOpenContract, T }) => {
  const [highlight, setHighlight] = useState(true);
  const [pickerOpen, setPickerOpen] = useState(false);
  const type = contracts[0]?.type;
  const COL = 'minmax(170px, 1fr)';
  const gridCols = `220px 200px repeat(${contracts.length}, ${COL})`;
  const removeContract = (id) => {
    const next = contracts.filter(c => c.id !== id);
    if (next.length === 0) onClose();
    else setContracts(next);
  };

  const cellPad = '11px 14px';
  const BENCH_BG = '#f1f5f9';

  return <div className="fade-in" style={{ flex:1, overflow:'auto', padding:22 }}>
    {/* Header */}
    <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-end', marginBottom:14, gap:14 }}>
      <div>
        <div style={{ fontSize:11, color:T.faint, fontWeight:600, textTransform:'uppercase', letterSpacing:0.5, marginBottom:4 }}>Side-by-side · {type} contracts</div>
        <h1 style={{ fontSize:20, fontWeight:700, color:T.text }}>Contract Comparison <span style={{ color:T.faint, fontSize:14, fontWeight:400 }}>({contracts.length} of 4)</span></h1>
      </div>
      <div style={{ display:'flex', gap:8, alignItems:'center' }}>
        <label style={{ display:'flex', alignItems:'center', gap:7, fontSize:12, color:T.muted, fontWeight:500, cursor:'pointer' }}>
          <input type="checkbox" checked={highlight} onChange={e=>setHighlight(e.target.checked)} style={{ accentColor:T.accent, cursor:'pointer' }} />
          Highlight best &amp; worst
        </label>
        {contracts.length < 4 && (
          <button className="btn-base" onClick={()=>setPickerOpen(true)} style={{ padding:'7px 14px', borderRadius:7, background:T.accent, color:'#fff', border:'none', fontSize:12, fontWeight:600 }}>+ Add contract</button>
        )}
        <button className="btn-base" onClick={onClose} style={{ padding:'7px 14px', borderRadius:7, background:T.cardBg, color:T.muted, border:`1px solid ${T.border}`, fontSize:12, fontWeight:600 }}>Close</button>
      </div>
    </div>

    {pickerOpen && <ComparePicker excludeIds={contracts.map(c=>c.id)} sameTypeAs={type} onPick={c=>{ setContracts([...contracts, c]); setPickerOpen(false); }} onClose={()=>setPickerOpen(false)} T={T} />}

    <div style={{ background:T.cardBg, borderRadius:12, boxShadow:'0 1px 4px rgba(0,0,0,0.07)', overflow:'hidden', border:`1px solid ${T.border}` }}>
      {/* Sticky identity row */}
      <div style={{ display:'grid', gridTemplateColumns:gridCols, borderBottom:`2px solid ${T.border}`, position:'sticky', top:0, background:T.cardBg, zIndex:2 }}>
        <div style={{ padding:cellPad, fontSize:10, color:T.faint, fontWeight:700, textTransform:'uppercase', letterSpacing:0.6, borderRight:`1px solid ${T.border}`, background:T.bg }}>
          Contract
        </div>
        <div style={{ padding:cellPad, background:BENCH_BG, borderRight:`2px solid ${T.border}` }}>
          <div style={{ fontSize:10, color:T.faint, fontWeight:700, textTransform:'uppercase', letterSpacing:0.6, marginBottom:4 }}>◇ Benchmark</div>
          <div style={{ fontSize:12, fontWeight:600, color:T.text }}>Organization</div>
          <div style={{ fontSize:11, color:T.muted, marginTop:2 }}>{CONTRACTS.length}-contract portfolio</div>
        </div>
        {contracts.map(c => (
          <div key={c.id} style={{ padding:cellPad, borderRight:`1px solid ${T.border}`, minWidth:0 }}>
            <div style={{ display:'flex', alignItems:'flex-start', justifyContent:'space-between', gap:6, marginBottom:6 }}>
              <div style={{ fontSize:13, fontWeight:700, color:T.text, lineHeight:1.3, minWidth:0, cursor:'pointer' }} onClick={()=>onOpenContract(c)}>{c.name}</div>
              {contracts.length > 1 && (
                <button className="btn-base" onClick={()=>removeContract(c.id)} title="Remove from comparison" style={{ background:'transparent', border:'none', color:T.faint, fontSize:14, cursor:'pointer', padding:0, lineHeight:1, flexShrink:0 }}>×</button>
              )}
            </div>
            <div style={{ fontSize:11, color:T.muted, marginBottom:6 }}>{c.payer}</div>
            <div style={{ display:'flex', gap:5, flexWrap:'wrap' }}>
              <TypeBadge type={c.type} T={T} />
              <Badge status={c.status} sm />
            </div>
          </div>
        ))}
      </div>

      {/* Section bodies */}
      {COMPARE_SECTIONS.map(sec => (
        <React.Fragment key={sec.name}>
          {/* Section band */}
          <div style={{ display:'grid', gridTemplateColumns:gridCols, background:T.bg, borderTop:`1px solid ${T.border}`, borderBottom:`1px solid ${T.border}` }}>
            <div style={{ padding:'8px 14px', fontSize:10, color:T.muted, fontWeight:700, textTransform:'uppercase', letterSpacing:0.7, gridColumn:`1 / ${contracts.length + 3}` }}>
              {sec.name}
            </div>
          </div>
          {sec.rows.map((row, ri) => {
            const m = computeRowMetrics(row, contracts);
            const lastRow = ri === sec.rows.length - 1;
            return (
              <div key={row.id} style={{ display:'grid', gridTemplateColumns:gridCols, borderBottom: lastRow?'none':`1px solid #f1f5f9`, alignItems:'stretch' }}>
                {/* Label */}
                <div style={{ padding:cellPad, fontSize:12, color:T.muted, background:T.bg, borderRight:`1px solid ${T.border}`, display:'flex', alignItems:'center' }}>
                  {row.label}
                </div>
                {/* Benchmark cell (anchor) */}
                <div style={{ padding:cellPad, background:BENCH_BG, borderRight:`2px solid ${T.border}`, display:'flex', flexDirection:'column', justifyContent:'center', gap:5 }}>
                  {row.statusCell ? (
                    <span style={{ fontSize:11, color:T.muted, fontStyle:'italic' }}>—</span>
                  ) : Number.isFinite(m.bench) ? (
                    <>
                      <span style={{ fontSize:13, fontWeight:600, color:T.text }}>{row.fmt(m.bench)}</span>
                      <span style={{ fontSize:10, color:T.faint, fontWeight:500 }}>org avg</span>
                    </>
                  ) : <span style={{ fontSize:11, color:T.muted }}>—</span>}
                </div>
                {/* Contract cells */}
                {contracts.map((c, i) => {
                  const v = m.vals[i];
                  const isBest = highlight && m.bestIdx === i && row.dir !== 0;
                  const isWorst = highlight && m.worstIdx === i && row.dir !== 0;
                  // Divergence bar (centered on benchmark)
                  const delta = (Number.isFinite(v) && Number.isFinite(m.bench)) ? v - m.bench : null;
                  const pct = (delta !== null && m.maxAbsDelta > 0) ? (delta / m.maxAbsDelta) * 46 : 0; // -46..+46
                  const fav = (delta === null || row.dir === 0) ? null : (Math.sign(delta) === Math.sign(row.dir) ? true : (delta === 0 ? null : false));
                  const barColor = fav === null ? '#cbd5e1' : (fav ? '#10b981' : '#f59e0b');
                  const left = pct >= 0 ? 50 : Math.max(0, 50 + pct);
                  const width = Math.max(Math.abs(pct), delta !== null && delta !== 0 ? 1.5 : 0);
                  const deltaLabel = (delta !== null && !row.statusCell)
                    ? (() => {
                        const sign = delta > 0 ? '+' : (delta < 0 ? '−' : '');
                        const abs = Math.abs(delta);
                        // Format delta in the same shape as the metric
                        if (row.fmt) {
                          const formatted = row.fmt(abs);
                          return `${sign}${formatted} vs benchmark`;
                        }
                        return `${sign}${abs} vs benchmark`;
                      })()
                    : '';
                  return (
                    <div key={c.id} title={deltaLabel} style={{ padding:cellPad, borderRight:`1px solid ${T.border}`, display:'flex', flexDirection:'column', justifyContent:'center', gap:7, minWidth:0 }}>
                      <div style={{ display:'flex', alignItems:'center', gap:6 }}>
                        {row.statusCell ? <Badge status={c.status} sm /> : (
                          <span style={{ fontSize:14, fontWeight:700, color:T.text }}>{row.fmt(v)}</span>
                        )}
                        {isBest && <span title="Best in row" style={{ fontSize:11, color:'#10b981', fontWeight:700, lineHeight:1 }}>▲</span>}
                        {isWorst && <span title="Worst in row" style={{ fontSize:11, color:'#f59e0b', fontWeight:700, lineHeight:1 }}>▼</span>}
                      </div>
                      {!row.statusCell && delta !== null && (
                        <div style={{ position:'relative', height:6, width:'100%', maxWidth:140 }}>
                          {/* Track */}
                          <div style={{ position:'absolute', inset:0, background:'#f1f5f9', borderRadius:2 }} />
                          {/* Center axis = benchmark */}
                          <div style={{ position:'absolute', left:'50%', top:-2, bottom:-2, width:1, background:'#94a3b8', transform:'translateX(-0.5px)' }} />
                          {/* Divergence bar */}
                          {width > 0 && (
                            <div className="bar-fill" style={{ position:'absolute', top:1, bottom:1, left:`${left}%`, width:`${width}%`, background:barColor, borderRadius:1, opacity: (isBest || isWorst) ? 1 : 0.78 }} />
                          )}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            );
          })}
        </React.Fragment>
      ))}
    </div>

    {/* Footer hint */}
    <div style={{ marginTop:14, fontSize:11, color:T.faint, lineHeight:1.55, display:'flex', gap:18, flexWrap:'wrap', alignItems:'center' }}>
      <span style={{ fontStyle:'italic' }}>Comparison restricted to same contract type ({type}). Benchmark = average across all {CONTRACTS.length} contracts in the organization's portfolio.</span>
      <span style={{ display:'inline-flex', alignItems:'center', gap:14, marginLeft:'auto' }}>
        <span style={{ display:'inline-flex', alignItems:'center', gap:5 }}>
          <span style={{ display:'inline-block', width:18, height:4, background:'#10b981', borderRadius:1 }} /> Better than benchmark
        </span>
        <span style={{ display:'inline-flex', alignItems:'center', gap:5 }}>
          <span style={{ display:'inline-block', width:18, height:4, background:'#f59e0b', borderRadius:1 }} /> Worse than benchmark
        </span>
        <span style={{ display:'inline-flex', alignItems:'center', gap:5 }}>
          <span style={{ display:'inline-block', width:1, height:9, background:'#94a3b8' }} /> Benchmark axis
        </span>
      </span>
    </div>
  </div>;
};

// ─── OPPORTUNITIES PAGE ───────────────────────────────────────────
// Cross-contract aggregated view of all interventions ranked by total
// incentive impact. Filter by type, effort, timeline, owner. Bulk-select
// to enroll in a cross-contract campaign, create a portfolio initiative,
// or add to a what-if forecast scenario.
const OPP_TYPE_STYLE = {
  Quality: { bg:'#dbeafe', color:'#1e40af', label:'Quality' },
  Cost:    { bg:'#dcfce7', color:'#065f46', label:'Cost' },
  Mixed:   { bg:'#ede9fe', color:'#6d28d9', label:'Mixed' },
};
const OPP_EFFORT_STYLE = {
  Low:  { color:'#10b981' },
  Med:  { color:'#f59e0b' },
  High: { color:'#ef4444' },
};
const OPP_TIMELINES = ['1-3 mo', '3-6 mo', '6-12 mo'];
const OPP_OWNERS = ['Care Mgmt', 'Clinical', 'Pharmacy', 'Operations'];

// Stable color per contract for stacked bars
const CONTRACT_COLOR = { c1:'#3b82f6', c2:'#ef4444', c3:'#8b5cf6', c4:'#f59e0b', c5:'#06b6d4', c6:'#10b981' };

const OpportunitiesPage = ({ onSelectContract, T }) => {
  const allOpps = useMemo(() => getPortfolioOpportunities(), []);
  const [selected, setSelected]   = useState(() => new Set());
  const [sort, setSort]           = useState('totalDollars_desc');
  const [filters, setFilters]     = useState({ type:'all', effort:'all', timeline:'all', owner:'all' });
  const [expanded, setExpanded]   = useState(null);
  const [bulkAction, setBulkAction] = useState(null);   // 'campaign' | 'initiative' | 'scenario'
  const [snack, setSnack]         = useState(null);
  const [scenarioBag, setScenarioBag] = useState(() => new Set());

  const visible = useMemo(() => {
    let xs = allOpps;
    if (filters.type     !== 'all') xs = xs.filter(o => o.type     === filters.type);
    if (filters.effort   !== 'all') xs = xs.filter(o => o.effort   === filters.effort);
    if (filters.timeline !== 'all') xs = xs.filter(o => o.timeline === filters.timeline);
    if (filters.owner    !== 'all') xs = xs.filter(o => o.owner    === filters.owner);
    const [key, dir] = sort.split('_');
    const m = dir === 'asc' ? 1 : -1;
    return [...xs].sort((a,b) => {
      const va = a[key], vb = b[key];
      if (typeof va === 'string') return va.localeCompare(vb) * m;
      return (va - vb) * m;
    });
  }, [allOpps, filters, sort]);

  // Aggregates / KPIs
  const totalOpp     = allOpps.reduce((s,o) => s + o.totalDollars, 0);
  const quickWins    = allOpps.filter(o => o.isQuickWin);
  const quickWinSum  = quickWins.reduce((s,o) => s + o.totalDollars, 0);
  const qualitySum   = allOpps.reduce((s,o) => s + o.qualityTotal, 0);
  const costSum      = allOpps.reduce((s,o) => s + o.costTotal, 0);
  const scenarioSum  = allOpps.filter(o => scenarioBag.has(o.id)).reduce((s,o) => s + o.totalDollars, 0);
  const visibleSum   = visible.reduce((s,o) => s + o.totalDollars, 0);

  // Bulk action helpers
  const selectedOpps = allOpps.filter(o => selected.has(o.id));
  const selectedSum  = selectedOpps.reduce((s,o) => s + o.totalDollars, 0);
  const selectedContracts = [...new Set(selectedOpps.flatMap(o => o.perContract.map(p => p.contract.id)))];

  const toggleAll = () => {
    const allOn = visible.every(o => selected.has(o.id));
    const next = new Set(selected);
    if (allOn) visible.forEach(o => next.delete(o.id));
    else       visible.forEach(o => next.add(o.id));
    setSelected(next);
  };
  const toggleOne = (id) => {
    const next = new Set(selected);
    if (next.has(id)) next.delete(id); else next.add(id);
    setSelected(next);
  };
  const toggleScenario = (id) => {
    const next = new Set(scenarioBag);
    if (next.has(id)) next.delete(id); else next.add(id);
    setScenarioBag(next);
  };
  const clearFilters = () => setFilters({ type:'all', effort:'all', timeline:'all', owner:'all' });
  const hasFilters = Object.values(filters).some(v => v !== 'all');

  const sortBtn = (key, label) => {
    const isThis = sort.startsWith(key+'_');
    return (
      <span onClick={()=>setSort(key + '_' + (isThis && sort.endsWith('_asc') ? 'desc' : 'asc'))}
            style={{ cursor:'pointer', userSelect:'none', display:'inline-flex', alignItems:'center', gap:3 }}>
        {label}
        {isThis && <span style={{ fontSize:9, color:T.accent }}>{sort.endsWith('_asc') ? '▲' : '▼'}</span>}
      </span>
    );
  };

  // Stacked $ bar showing contract split
  const StackedBar = ({ perContract, total, w=170 }) => {
    if (!perContract.length || total === 0) return null;
    let acc = 0;
    return (
      <div style={{ display:'flex', alignItems:'center', gap:6 }}>
        <div style={{ width:w, height:8, background:'#f1f5f9', borderRadius:4, overflow:'hidden', display:'flex' }}>
          {perContract.map((p,i) => {
            const pct = p.totalDollars / total * 100;
            acc += pct;
            return (
              <div key={i}
                   title={`${p.contract.name.split(' — ')[0]} · ${fmtM(p.totalDollars)}`}
                   style={{ width:`${pct}%`, height:'100%', background:CONTRACT_COLOR[p.contract.id] || T.muted, borderRight: i<perContract.length-1?'1px solid #fff':'none' }} />
            );
          })}
        </div>
        <span style={{ fontSize:11, fontWeight:600, color:T.muted, whiteSpace:'nowrap' }}>{perContract.length}</span>
      </div>
    );
  };

  // Columns: ☐ | Intervention | Type | Total $ | Contract split | Members | Effort | Timeline | Owner | Scn | ▾
  const cols = '36px minmax(220px,2.2fr) 80px 110px 200px 90px 60px 90px 110px 80px 28px';

  return (
    <div className="fade-in" style={{ flex:1, overflow:'auto', padding:22, position:'relative' }}>
      {/* Header */}
      <div style={{ marginBottom:16, display:'flex', justifyContent:'space-between', alignItems:'flex-start', gap:20 }}>
        <div>
          <div style={{ fontSize:11, color:T.faint, fontWeight:600, textTransform:'uppercase', letterSpacing:0.6 }}>Portfolio · all contracts</div>
          <h1 style={{ fontSize:22, fontWeight:700, color:T.text, marginTop:4 }}>Opportunities</h1>
          <div style={{ fontSize:13, color:T.muted, marginTop:5, maxWidth:760 }}>Cross-contract care gap closures and cost reduction levers, aggregated by incentive impact. Bulk-select to enroll in a campaign, kick off a portfolio initiative, or add to a what-if scenario.</div>
        </div>
        <button className="btn-base" style={{ background:T.accentLight, color:T.accentText, border:'none', padding:'8px 14px', borderRadius:7, fontSize:12, fontWeight:600, flexShrink:0 }}>Export ranked list →</button>
      </div>

      {/* KPI strip */}
      <div style={{ display:'grid', gridTemplateColumns:'repeat(4, 1fr)', gap:12, marginBottom:14 }}>
        <KPI label="Total Opportunity"      value={fmtM2(totalOpp)}     sub={`Across ${allOpps.length} interventions · ${CONTRACTS.length} contracts`} accent={T.accent} T={T} />
        <KPI label="Quality Incentives"     value={fmtM2(qualitySum)}   sub={`${Math.round(qualitySum/totalOpp*100)}% of total · gap closures`} accent="#8b5cf6" T={T} />
        <KPI label="Cost Savings"           value={fmtM2(costSum)}      sub={`${Math.round(costSum/totalOpp*100)}% of total · operational levers`} accent="#10b981" T={T} />
        <KPI label="Quick Wins"             value={`${quickWins.length}`} sub={`${fmtM(quickWinSum)} · Low effort, 1-3 mo`} accent={T.warn||'#f59e0b'} T={T} />
      </div>

      {/* What-if scenario bag (sticky-ish) */}
      {scenarioBag.size > 0 && (

        </div>

      {/* Filters */}
      <div style={{ background:T.cardBg, borderRadius:10, padding:'12px 18px', marginBottom:12, boxShadow:'0 1px 3px rgba(0,0,0,0.05)', display:'flex', alignItems:'center', gap:18, flexWrap:'wrap' }}>
        {/* Type filter */}
        <div style={{ display:'flex', alignItems:'center', gap:6 }}>
          <span style={{ fontSize:10, color:T.faint, fontWeight:700, textTransform:'uppercase', letterSpacing:0.5, display:'inline-flex', alignItems:'center' }}>Type<InfoTip text={OPP_TYPE_TIP} label="What Type means" /></span>
          {['all','Quality','Cost','Mixed'].map(t => {
            const active = filters.type === t;
            const st = OPP_TYPE_STYLE[t];
            return (
              <button key={t} onClick={()=>setFilters({...filters, type:t})} className="btn-base" style={{
                background: active ? (st?.color || T.accent) : (st?.bg || T.bg),
                color: active ? '#fff' : (st?.color || T.muted),
                border: 'none', padding:'4px 12px', borderRadius:12, fontSize:11, fontWeight:600
              }}>{t === 'all' ? 'All' : t}</button>
            );
          })}
        </div>
        <span style={{ width:1, height:20, background:T.border }}></span>
        {/* Effort */}
        <div style={{ display:'flex', alignItems:'center', gap:6 }}>
          <span style={{ fontSize:10, color:T.faint, fontWeight:700, textTransform:'uppercase', letterSpacing:0.5 }}>Effort</span>
          {['all','Low','Med','High'].map(e => {
            const active = filters.effort === e;
            return (
              <button key={e} onClick={()=>setFilters({...filters, effort:e})} className="btn-base" style={{
                background: active ? T.accent : T.bg,
                color: active ? '#fff' : (OPP_EFFORT_STYLE[e]?.color || T.muted),
                border: 'none', padding:'4px 12px', borderRadius:12, fontSize:11, fontWeight:600
              }}>{e === 'all' ? 'Any' : e}</button>
            );
          })}
        </div>
        <span style={{ width:1, height:20, background:T.border }}></span>
        {/* Timeline */}
        <div style={{ display:'flex', alignItems:'center', gap:6 }}>
          <span style={{ fontSize:10, color:T.faint, fontWeight:700, textTransform:'uppercase', letterSpacing:0.5 }}>Timeline</span>
          {['all', ...OPP_TIMELINES].map(t => {
            const active = filters.timeline === t;
            return (
              <button key={t} onClick={()=>setFilters({...filters, timeline:t})} className="btn-base" style={{
                background: active ? T.accent : T.bg,
                color: active ? '#fff' : T.muted, border:'none',
                padding:'4px 12px', borderRadius:12, fontSize:11, fontWeight:600
              }}>{t === 'all' ? 'Any' : t}</button>
            );
          })}
        </div>
        <span style={{ width:1, height:20, background:T.border }}></span>
        {/* Owner */}
        <div style={{ display:'flex', alignItems:'center', gap:6 }}>
          <span style={{ fontSize:10, color:T.faint, fontWeight:700, textTransform:'uppercase', letterSpacing:0.5 }}>Owner</span>
          <select value={filters.owner} onChange={e=>setFilters({...filters, owner:e.target.value})}
                  style={{ padding:'4px 10px', borderRadius:6, border:`1px solid ${T.border}`, fontSize:11, fontWeight:600, color:T.text, background:T.cardBg, cursor:'pointer' }}>
            <option value="all">Any</option>
            {OPP_OWNERS.map(o => <option key={o} value={o}>{o}</option>)}
          </select>
        </div>
        {hasFilters && (
          <button onClick={clearFilters} className="btn-base" style={{ marginLeft:'auto', background:'transparent', color:T.muted, border:'none', fontSize:11, fontWeight:600 }}>Clear filters ✕</button>

      </div>

      {/* Bulk action toolbar */}
      {selected.size > 0 && (
        <div className="slide-up" style={{ background:T.text, color:'#fff', borderRadius:10, padding:'12px 18px', marginBottom:12, display:'flex', alignItems:'center', gap:14, flexWrap:'wrap' }}>
          <div>
            <div style={{ fontSize:13, fontWeight:700 }}>{selected.size} intervention{selected.size===1?'':'s'} selected</div>
            <div style={{ fontSize:11, color:'rgba(255,255,255,0.6)' }}>Combined opportunity: {fmtM(selectedSum)} · {selectedContracts.length} contracts impacted</div>
          </div>
          <span style={{ width:1, height:30, background:'rgba(255,255,255,0.2)' }}></span>
          <button onClick={()=>setBulkAction('campaign')} className="btn-base" style={{ background:'#fff', color:T.text, border:'none', padding:'7px 14px', borderRadius:6, fontSize:12, fontWeight:600 }}>Enroll in campaign →</button>
          <button onClick={()=>setBulkAction('initiative')} className="btn-base" style={{ background:'rgba(255,255,255,0.15)', color:'#fff', border:'1px solid rgba(255,255,255,0.3)', padding:'7px 14px', borderRadius:6, fontSize:12, fontWeight:600 }}>Create portfolio initiative →</button>
          <button onClick={()=>setBulkAction('scenario')} className="btn-base" style={{ background:'rgba(255,255,255,0.15)', color:'#fff', border:'1px solid rgba(255,255,255,0.3)', padding:'7px 14px', borderRadius:6, fontSize:12, fontWeight:600 }}>Add to what-if scenario →</button>
          <button onClick={()=>setSelected(new Set())} className="btn-base" style={{ marginLeft:'auto', background:'transparent', color:'rgba(255,255,255,0.7)', border:'none', fontSize:12, fontWeight:600 }}>Clear</button>
        </div>

      {/* Ranked table */}
      <div style={{ background:T.cardBg, borderRadius:12, boxShadow:'0 1px 4px rgba(0,0,0,0.07)', overflow:'hidden' }}>

          <div>
            <div style={{ fontSize:14, fontWeight:700, color:T.text }}>Ranked Opportunities</div>
            <div style={{ fontSize:12, color:T.muted, marginTop:2 }}>Bulk-select rows to take portfolio-level action. Click a row to see per-contract breakdown.</div>
          </div>
          <div style={{ fontSize:12, color:T.muted }}><b style={{ color:T.text }}>{visible.length}</b> of {allOpps.length} · <b style={{ color:T.text }}>{fmtM(visibleSum)}</b> visible opportunity</div>
        </div>

        {/* Column headers */}
        <div style={{ display:'grid', gridTemplateColumns:cols, columnGap:10, padding:'10px 22px', background:'#fafbfc', borderBottom:`1px solid ${T.border}`, alignItems:'center', fontSize:10, fontWeight:700, color:T.faint, textTransform:'uppercase', letterSpacing:0.5 }}>
          <div>
            <input type="checkbox" checked={visible.length>0 && visible.every(o=>selected.has(o.id))} onChange={toggleAll} style={{ width:15, height:15, accentColor:T.accent, cursor:'pointer' }} />
          </div>
          <div>{sortBtn('name','Intervention')}</div>
          <div style={{ display:'flex', alignItems:'center' }}>Type<InfoTip text={OPP_TYPE_TIP} label="What Type means" /></div>
          <div style={{ textAlign:'right' }}>{sortBtn('totalDollars','Total $')}</div>
          <div>Contract split</div>
          <div style={{ textAlign:'right' }}>{sortBtn('totalMembers','Members')}</div>
          <div>{sortBtn('effort','Effort')}</div>
          <div>{sortBtn('timeline','Timeline')}</div>
          <div>{sortBtn('owner','Owner')}</div>
          <div style={{ textAlign:'center' }}>Scenario</div>
          <div></div>
        </div>

        {/* Rows */}
        {visible.map((o, i) => {
          const isSel = selected.has(o.id);
          const isExp = expanded === o.id;
          const inScn = scenarioBag.has(o.id);
          const tyle  = OPP_TYPE_STYLE[o.type];
          return (
            <React.Fragment key={o.id}>
              <div className="row-hover" style={{ display:'grid', gridTemplateColumns:cols, columnGap:10, padding:'12px 22px', borderBottom: i<visible.length-1 || isExp?`1px solid #f1f5f9`:'none', alignItems:'center', background: isSel ? `${T.accentLight}55` : (isExp ? '#fbfdff' : 'transparent') }}>
                <div onClick={e=>e.stopPropagation()}>
                  <input type="checkbox" checked={isSel} onChange={()=>toggleOne(o.id)} style={{ width:15, height:15, accentColor:T.accent, cursor:'pointer' }} />
                </div>
                <div onClick={()=>setExpanded(isExp?null:o.id)} style={{ cursor:'pointer', minWidth:0 }}>
                  <div style={{ display:'flex', alignItems:'center', gap:6 }}>
                    <div style={{ fontSize:13, fontWeight:600, color:T.text, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{o.name}</div>

                  </div>
                  <div style={{ fontSize:11, color:T.faint, marginTop:2 }}>{o.category}</div>
                </div>
                <div onClick={()=>setExpanded(isExp?null:o.id)} style={{ cursor:'pointer' }}>
                  <span style={{ background:tyle.bg, color:tyle.color, fontSize:10, fontWeight:700, padding:'3px 9px', borderRadius:10 }}>{tyle.label}</span>
                </div>
                <div onClick={()=>setExpanded(isExp?null:o.id)} style={{ cursor:'pointer', textAlign:'right' }}>
                  <div style={{ fontSize:14, fontWeight:700, color:T.text }}>{fmtM(o.totalDollars)}</div>
                  {o.type === 'Mixed' && o.qualityTotal > 0 && o.costTotal > 0 && (
                    <div style={{ fontSize:10, color:T.faint, marginTop:1 }}>Q {fmtM(o.qualityTotal)} · C {fmtM(o.costTotal)}</div>
