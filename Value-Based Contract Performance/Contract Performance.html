// ─── RISK ADJUSTMENT ──────────────────────────────────────────────

// Risk model by contract type: Medicare contracts (MSSP, BPCI) use CMS-HCC;

const hccModelLabel = c => ['MSSP','BPCI'].includes(c.type) ? 'CMS-HCC 2025 blend (67% V28 / 33% V24)' : 'HHS-HCC v08';

// Suspect-condition reference set. `evKey` links each condition to its

// shared by the Medicare and commercial versions below.
const HCC_CONDITIONS = [
  { evKey:'HCC 18',  evidence:'Lab + Rx',     basis:'A1c >9% on insulin without complication code',          prevalence:0.082, captureRate:0.55 },
  { evKey:'HCC 85',  evidence:'Echo + Rx',    basis:'EF <40% on echo or loop diuretic + ACE/ARB, no CHF dx', prevalence:0.061, captureRate:0.48 },
  { evKey:'HCC 111', evidence:'Spiro + Rx',   basis:'FEV1/FVC <0.7 or LABA/LAMA combo, no COPD dx',          prevalence:0.074, captureRate:0.52 },
  { evKey:'HCC 108', evidence:'Imaging + Rx', basis:'Carotid stenosis on US or statin + clopidogrel',        prevalence:0.108, captureRate:0.60 },

// NonDual, Aged. `baseRaf` = 0.67 × V28 + 0.33 × V24 (normalization ignored).
// V28 has no payment HCC for uncomplicated vascular disease, so that suspect
// carries only its V24 share.
const CMS_MAP = {
  'HCC 18':  { code:'HCC 37',      v24:'HCC 18',  name:'Diabetes with Chronic Complications',               v28Raf:0.166, v24Raf:0.302 },
  'HCC 85':  { code:'HCC 226',     v24:'HCC 85',  name:'Heart Failure, Except End-Stage and Acute',         v28Raf:0.360, v24Raf:0.331 },
  'HCC 111': { code:'HCC 280',     v24:'HCC 111', name:'COPD, Interstitial and Other Chronic Lung Disorders', v28Raf:0.319, v24Raf:0.335 },
  'HCC 108': { code:'V24 HCC 108', v24:'HCC 108', name:'Vascular Disease (no V28 payment HCC)',            v28Raf:0,     v24Raf:0.288 },
  'HCC 138': { code:'HCC 327',     v24:'HCC 137', name:'Chronic Kidney Disease, Severe (Stage 4)',          v28Raf:0.514, v24Raf:0.289 },

  'HCC 59':  { code:'HCC 155',     v24:'HCC 59',  name:'Major Depression, Moderate or Severe, without Psychosis', v28Raf:0.299, v24Raf:0.309 },
};
const HCC_LIBRARY = HCC_CONDITIONS.map(h => {
  const m = CMS_MAP[h.evKey];
  return { ...h, ...m, baseRaf: +(0.67 * m.v28Raf + 0.33 * m.v24Raf).toFixed(3) };
});

// uncomplicated vascular disease or morbid obesity, so those two suspects do not
// apply to commercial contracts. Evidence, prevalence and capture assumptions
// carry over from the matching CMS-HCC row.

  'HCC 18':  { code:'HHS-HCC 20',  name:'Diabetes with Chronic Complications',                 baseRaf:0.142 },

};
const HHS_HCC_LIBRARY = HCC_CONDITIONS.filter(h => HHS_MAP[h.evKey]).map(h => ({ ...h, ...HHS_MAP[h.evKey] }));
const hccLibraryFor = c => ['MSSP','BPCI'].includes(c.type) ? HCC_LIBRARY : HHS_HCC_LIBRARY;

const getExecSummary = (c) => {
  const pr = PRIOR[c.id];
  const capNow  = CAPITATION[c.id];
  const capPrev = pr.capitationPMPM;
  const membersRetained = pr.members - pr.membersDropped;
  const membersNow  = c.members;
  const netChange   = membersNow - pr.members;
  const capImpact   = (membersNow - pr.members) * capNow * 12; // annual
  const retentionCapImpact = (membersNow - pr.membersAdded) * (capNow - capPrev) * 12;
  // MLR derived from medical spend trend vs prior, anchored on prior MLR
  const mlrPrev = pr.mlr;
  const mlrNow  = +(mlrPrev * (c.costPMPM / pr.medSpendPMPM)).toFixed(3);
  const medSpendNow  = c.costPMPM;
  const medSpendPrev = pr.medSpendPMPM;
  return {
    // incentive
    poolCur: c.incentivePool, poolPrev: pr.incentivePool,
    earnedCur: c.incentiveEarned, earnedPrev: pr.incentiveEarned,
    earnedPctCur:  c.incentiveEarned  / c.incentivePool  * 100,
    earnedPctPrev: pr.incentiveEarned / pr.incentivePool * 100,
    // members
    membersPrev: pr.members, membersNow,
    membersAdded: pr.membersAdded, membersDropped: pr.membersDropped,
    membersRetained, netChange,
    capNow, capPrev,
    capAnnualCur:  membersNow  * capNow  * 12,
    capAnnualPrev: pr.members  * capPrev * 12,
    capImpact,
    // medical spend / MLR
    medSpendNow, medSpendPrev,
    mlrNow, mlrPrev,
    mlrTarget: ['MSSP','Commercial'].includes(c.type) ? 0.85 : 0.88,
  };
};

  const k = MULTIPLIERS[id] || 1;
  const actual = parseFloat((m.actual * k).toFixed(1));
  return { ...m, actual, ceiling: parseFloat((actual * m.ceilRatio).toFixed(1)), trend: m.trend.map(v => parseFloat((v*k).toFixed(1))) };
});

// Compute one intervention's impact at one contract
const calcInterventionImpact = (intv, c) => {
  let qualityDollars = 0;
  let costDollars = 0;
  let membersImpacted = 0;
  let qualityGap = null;

  // Quality piece
  if (intv.qualityMeasureId) {
    const measures = getMeasures(c.id);
    const totalWt = measures.reduce((s,x) => s + x.weight, 0);
    const m = measures.find(x => x.id === intv.qualityMeasureId);
    if (m) {
      const gap = m.inverse ? Math.max(0, m.actual - m.target) : Math.max(0, m.target - m.actual);
      const reachable = m.inverse ? m.ceiling <= m.target : m.ceiling >= m.target;
      if (gap > 0 && reachable) {
        // Closing gap flips the measure to Achieved → gain m.weight/totalWt × quality & utilization pool (65% of incentive)
        const qualityPool = c.incentivePool * QU_SHARE;
        qualityDollars = m.weight / totalWt * qualityPool;
        membersImpacted += Math.round(c.members * Math.min(0.4, gap / 100));
        qualityGap = { current: m.actual, target: m.target, ceiling: m.ceiling, name: m.name, gap: gap.toFixed(1) };
      } else if (gap > 0) {
        // Ceiling falls short of target → cannot be Achieved this period → $0
        qualityGap = { current: m.actual, target: m.target, ceiling: m.ceiling, name: m.name, gap: gap.toFixed(1), unreachable: true };
      }
    }
  }

  // Cost piece
  if (intv.costCategory && intv.costLeverName) {
    const fin = getFinancials(c);
    const cat = fin.categories.find(x => x.name === intv.costCategory);
    if (cat) {
      const subs = getSubcategories(c, cat.name, cat.target, cat.actual);
      const catLevers = LEVERS[intv.costCategory] || [];
      const lv = catLevers.find(l => l.name === intv.costLeverName);
      if (lv) {
        const sub = subs.find(s => s.name === lv.target);
        const overspend = sub ? Math.max(0, sub.actual - sub.target) : 0;
        if (overspend > 0) {
          costDollars = overspend * lv.capture * c.members * 12;
          membersImpacted = Math.max(membersImpacted, Math.round(c.members * 0.28));
        }
      }
    }
  }

  return { contract: c, qualityDollars, costDollars, totalDollars: qualityDollars + costDollars, membersImpacted, qualityGap };
};

// Compute opportunities across all contracts for all interventions
const getPortfolioOpportunities = () => {
  return PORTFOLIO_INTERVENTIONS.map(intv => {
    const impacts = CONTRACTS.map(c => calcInterventionImpact(intv, c));
    const perContract = impacts.filter(x => x.totalDollars > 1000);   // suppress noise
    const unreachable = impacts.filter(x => x.qualityGap?.unreachable);
    const totalDollars = perContract.reduce((s,x) => s + x.totalDollars, 0);
    const totalMembers = perContract.reduce((s,x) => s + x.membersImpacted, 0);
    const qualityTotal = perContract.reduce((s,x) => s + x.qualityDollars, 0);
    const costTotal = perContract.reduce((s,x) => s + x.costDollars, 0);
    return {
      ...intv,
      perContract,
      unreachable,
      totalDollars,
      totalMembers,
      qualityTotal,
      costTotal,
      contractCount: perContract.length,
      isQuickWin: intv.effort === 'Low' && intv.timeline === '1-3 mo' && totalDollars > 0,
    };
  }).filter(o => o.contractCount > 0 || o.unreachable.length > 0)
    .sort((a,b) => b.totalDollars - a.totalDollars);
};

const getSubcategories = (c, catName, catTarget, catActual) => {
  const defs = SUBCATS[catName] || [];
  // First pass: raw shares from tShare * aMult
  const raw = defs.map(d => ({ ...d, target: catTarget * d.tShare, rawActual: catTarget * d.tShare * d.aMult }));
  const rawSum = raw.reduce((s,x)=>s+x.rawActual,0) || 1;
  // Normalize so subcategory actuals sum to the category actual
  return raw.map(d => ({
    name:d.name,
    target: +(d.target).toFixed(0),
    actual: +(d.rawActual * catActual / rawSum).toFixed(0),
  }));
};

// ─── HELPERS ──────────────────────────────────────────────────────
const fmtM  = v => v >= 1e6 ? `$${(v/1e6).toFixed(1)}M` : `$${(v/1e3).toFixed(0)}K`;
const fmtN  = v => new Intl.NumberFormat('en-US').format(Math.round(v));
const fmtPct= v => `${parseFloat(v).toFixed(1)}%`;
const getMeasureStatus = m => {
  const d = m.inverse ? m.target - m.actual : m.actual - m.target;
  return d >= 0 ? 'on_track' : d >= -3 ? 'at_risk' : 'below_target';
};
const fmtM2 = v => v >= 1e6 ? `$${(v/1e6).toFixed(2)}M` : `$${(v/1e3).toFixed(0)}K`;

// ─── INCENTIVE RULE ───────────────────────────────────────────────
// Quality and utilization measures share one pool (65% of the incentive);
// cost savings is the other 35%. Every measure carries equal weight and is
// scored Achieved (1) if at/better than target, else Not Achieved (0).
const QU_SHARE = 0.65, COST_SHARE = 0.35;
const QUALITY_SCORE_TARGET = 75; // 6 of 8 measures achieved
CONTRACTS.forEach(c => {
  const ms = getMeasures(c.id);
  const achieved = ms.filter(m => getMeasureStatus(m) === 'on_track').length;
  c.measuresAchieved = achieved;
  c.qualityScore  = Math.round(achieved / ms.length * 1000) / 10;
  c.qualityTarget = QUALITY_SCORE_TARGET;
  c.costEarned    = c.incentiveEarned * 0.38; // cost-savings share of reported YTD earnings (unchanged)
  c.qualityEarned = c.incentivePool * QU_SHARE * achieved / ms.length;
  c.incentiveEarned = c.qualityEarned + c.costEarned;

  // Overall status = the worse of quality and cost.
  // Quality: on track at/above the score target; at risk within one measure
  // (12.5 pts) of it; below target otherwise.
  // Cost: on track at/under the PMPM target; at risk up to 3% over; below target beyond.
  const RANK = { on_track:0, at_risk:1, below_target:2 };
  const oneMeasure = 100 / ms.length;
  c.qualityStatus = c.qualityScore >= c.qualityTarget ? 'on_track'
           : c.qualityScore >= c.qualityTarget - oneMeasure ? 'at_risk' : 'below_target';
  const costOver = (c.costPMPM - c.costTarget) / c.costTarget * 100;
  c.costStatus = costOver <= 0 ? 'on_track' : costOver <= 3 ? 'at_risk' : 'below_target';
  c.status = RANK[c.costStatus] > RANK[c.qualityStatus] ? c.costStatus : c.qualityStatus;

  // Alerts, derived from the same measures and targets
  const fmtGap = m => {
    const g = Math.abs(m.actual - m.target);
    return m.name.includes('per 1K') ? `${g.toFixed(1)} per 1K` : `${g.toFixed(1)} pts`;
  };
  const list = [];
  if (c.qualityStatus !== 'on_track') list.push({ sev: c.qualityStatus === 'below_target' ? 'critical' : 'warning',
    msg: 'Quality score below target',
    short: `Score ${c.qualityScore} vs ${c.qualityTarget} target · ${achieved} of ${ms.length} measures achieved` });
  const far = ms.filter(m => getMeasureStatus(m) === 'below_target');
  if (far.length) list.push({ sev:'critical', msg:'Measures not achieved',
    short: `${far.length} measure${far.length>1?'s':''} more than 3 pts from target: ${far.map(m => m.name).join(', ')}` });
  ms.filter(m => getMeasureStatus(m) === 'at_risk').forEach(m => list.push({ sev:'warning',
    msg:'Measure close to target', short:`${m.name} ${fmtGap(m)} ${m.inverse ? 'above' : 'below'} target` }));
  if (c.costStatus !== 'on_track') list.push({ sev: c.costStatus === 'below_target' ? 'critical' : 'warning',
    msg:'Cost PMPM exceeds target',
    short: `Cost $${c.costPMPM}/pm vs $${c.costTarget} target (+${costOver.toFixed(1)}%)` });
  if (c.alerts >= 2) list.push({ sev:'warning', msg:'Data submission deadline approaching',
    short: 'Q1 quality data submission due in 14 days' });
  c.alertList = list;
  c.alerts = list.length;
});

// ─── CONTRACT LIST ────────────────────────────────────────────────
const ContractList = ({ onSelect, onCompare, T }) => {
  const [q, setQ] = useState('');
  const [filter, setFilter] = useState('all');
  const [typeFilter, setTypeFilter] = useState('all');
  const [selected, setSelected] = useState([]);   // array of contract ids
  const selectedContracts = CONTRACTS.filter(c => selected.includes(c.id));
  const lockedType = selectedContracts[0]?.type || null;

  const list = CONTRACTS.filter(c => {
    const m = c.name.toLowerCase().includes(q.toLowerCase()) || c.payer.toLowerCase().includes(q.toLowerCase());
    const f = filter==='all' || c.status===filter;
    const t = typeFilter==='all' || c.type===typeFilter;
    return m && f && t;
  });
  const total = { pool:CONTRACTS.reduce((s,c)=>s+c.incentivePool,0), earned:CONTRACTS.reduce((s,c)=>s+c.incentiveEarned,0), members:CONTRACTS.reduce((s,c)=>s+c.members,0), alerts:CONTRACTS.reduce((s,c)=>s+c.alerts,0) };
  const allTypes = ['all', ...Array.from(new Set(CONTRACTS.map(c=>c.type)))];

  const toggleSelect = (c) => {
    if (selected.includes(c.id)) {
      setSelected(selected.filter(id => id !== c.id));
    } else if (selected.length >= 4) {
      return;
    } else if (lockedType && c.type !== lockedType) {
      return;
    } else {
      setSelected([...selected, c.id]);
    }
  };
  const isSelectable = (c) => {
    if (selected.includes(c.id)) return true;
    if (selected.length >= 4) return false;
    if (lockedType && c.type !== lockedType) return false;
    return true;
  };

  const cols = 'minmax(40px,40px) minmax(220px,2fr) 100px 110px 120px 130px 130px 60px';

  return <div className="fade-in" style={{ flex:1, overflow:'auto', padding:22, position:'relative' }}>
    {/* Summary KPIs */}
    <div style={{ display:'flex', gap:12, marginBottom:20 }}>
      <KPI label="Total Incentive Pool" value={fmtM(total.pool)} sub={`Across ${CONTRACTS.length} active contracts`} accent={T.accent} T={T} />
      <KPI label="Earned YTD (est.)" value={fmtM(total.earned)} sub={`${fmtPct(total.earned/total.pool*100)} of pool`} accent="#10b981" T={T} />
      <KPI label="Attributed Lives" value={fmtN(total.members)} sub="All contracts combined" accent="#f59e0b" T={T} />
      <KPI label="Active Alerts" value={total.alerts} sub="Require attention" accent="#ef4444" T={T} />
    </div>

    {/* Toolbar */}
    <div style={{ display:'flex', gap:8, marginBottom:10, alignItems:'center' }}>
      <div style={{ flex:1, position:'relative' }}>
        <span style={{ position:'absolute', left:11, top:'50%', transform:'translateY(-50%)', color:T.faint, fontSize:15, pointerEvents:'none' }}>⌕</span>
        <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search contracts or payers…"
          style={{ width:'100%', padding:'7px 12px 7px 32px', borderRadius:8, border:`1px solid ${T.border}`, fontSize:13, outline:'none', background:T.cardBg, color:T.text }} />
      </div>
      {[['all','All'],[`on_track`,'On Track'],['at_risk','At Risk'],['below_target','Below Target']].map(([v,l]) =>
        <button key={v} className="btn-base" onClick={()=>setFilter(v)} style={{ padding:'6px 14px', borderRadius:7, fontSize:12, fontWeight:600, background:filter===v?T.accent:T.cardBg, color:filter===v?'#fff':T.muted, border:`1px solid ${filter===v?T.accent:T.border}` }}>{l}</button>
      )}
    </div>

    {/* Type filter row */}
    <div style={{ display:'flex', gap:6, marginBottom:14, alignItems:'center', flexWrap:'wrap' }}>
      <span style={{ fontSize:10, color:T.faint, fontWeight:700, textTransform:'uppercase', letterSpacing:0.6, marginRight:4 }}>Type / Program</span>
      {allTypes.map(t => (
        <button key={t} className="btn-base" onClick={()=>setTypeFilter(t)} style={{ padding:'4px 11px', borderRadius:14, fontSize:11, fontWeight:600, background:typeFilter===t?T.accentLight:'transparent', color:typeFilter===t?T.accentText:T.muted, border:`1px solid ${typeFilter===t?T.accent:T.border}` }}>{t==='all'?'All types':t}</button>
      ))}

        <span style={{ fontSize:11, color:T.faint, marginLeft:'auto', fontStyle:'italic' }}>Tip: select 2–4 same-type rows to compare</span>

    {/* Sticky compare banner */}
    {selected.length >= 1 && (
      <div className="slide-up" style={{ position:'sticky', top:0, zIndex:50, marginBottom:12, background:T.text, color:'#fff', borderRadius:10, padding:'10px 14px 10px 18px', boxShadow:'0 6px 22px rgba(15,23,42,0.22)', display:'flex', alignItems:'center', gap:12, flexWrap:'wrap' }}>
        <div style={{ display:'flex', gap:6, alignItems:'center', flexShrink:0 }}>

        </div>
        <div style={{ display:'flex', gap:4, flexWrap:'wrap', flex:1, minWidth:0 }}>
          {selectedContracts.map(c => (
            <span key={c.id} style={{ background:'rgba(255,255,255,0.12)', borderRadius:14, padding:'3px 10px', fontSize:11, display:'inline-flex', alignItems:'center', gap:5, whiteSpace:'nowrap' }}>

              <span onClick={()=>setSelected(selected.filter(id=>id!==c.id))} style={{ cursor:'pointer', opacity:0.7, fontSize:13, lineHeight:1 }}>×</span>

          {selected.length > 0 && <span style={{ color:T.accent }}>{selected.length}/4</span>}
        </div>
        {['Contract / Payer','Type','Status','Attributed Lives','Pool','Earned YTD (est.)',''].map((h,i)=>
          <div key={i} style={{ fontSize:10, fontWeight:700, color:T.faint, textTransform:'uppercase', letterSpacing:0.6 }}>{h}</div>)}
      </div>
      {list.map((c,i) => {
        const checked = selected.includes(c.id);
        const selectable = isSelectable(c);
        const disabled = !selectable && !checked;
        const tooltip = disabled
          ? (lockedType && c.type !== lockedType
              ? `Different type — comparing ${lockedType} only`
              : 'Maximum of 4 contracts can be compared')
          : '';
        return (
          <div key={c.id} className="row-hover"
            onClick={(e)=>{ if (e.target.tagName !== 'INPUT' && !e.target.closest('.cmp-check')) onSelect(c); }}
            style={{ display:'grid', gridTemplateColumns:cols, padding:'13px 20px', borderBottom: i<list.length-1?`1px solid #f1f5f9`:'none', alignItems:'center', cursor:'pointer', opacity: disabled ? 0.45 : 1, background: checked ? `${T.accentLight}55` : 'transparent' }}>
            <div className="cmp-check" onClick={e=>e.stopPropagation()} title={tooltip}>

            <div><TypeBadge type={c.type} T={T} /></div>

      })}
      {list.length === 0 && <div style={{ padding:32, textAlign:'center', color:T.faint, fontSize:13 }}>No contracts match your filters.</div>}
    </div>
  </div>;
};

// ─── DELTA CHIP ───────────────────────────────────────────────────
const DeltaChip = ({ value, fav, label, fmt }) => {
  const pos = fav === undefined ? value >= 0 : fav;
  const color = pos ? '#059669' : '#dc2626';
  const bg    = pos ? '#f0fdf4' : '#fef2f2';
  const arrow = value >= 0 ? '▲' : '▼';
  return (
    <span style={{ display:'inline-flex', alignItems:'center', gap:3, background:bg, color, borderRadius:6, padding:'2px 8px', fontSize:11, fontWeight:700, whiteSpace:'nowrap' }}>
      {arrow} {fmt ? fmt(Math.abs(value)) : Math.abs(value).toFixed(1)}{label||''}
      <span style={{ fontWeight:400, opacity:0.7 }}> vs prior period</span>
    </span>
  );
};

// ─── CONTRACT DASHBOARD ───────────────────────────────────────────
const ContractDashboard = ({ c, onNav, onCompare, T }) => {
  const [pickerOpen, setPickerOpen] = useState(false);
  const measures = getMeasures(c.id);
  const s = getExecSummary(c);
  const earnedPct = c.incentiveEarned / c.incentivePool * 100;
  const QUALITY_WEIGHT = QU_SHARE; // quality & utilization component = 65% of pool

  // Member panel
  const memDelta   = s.membersNow - s.membersPrev;
  const capDiff    = s.capAnnualCur - s.capAnnualPrev;

  // Financial
  const spendDiff  = c.costPMPM - s.medSpendPrev;
  const mlrDiffPts = (s.mlrNow - s.mlrPrev) * 100;
  const isMSSP     = c.type === 'MSSP';
  const isMLR      = c.type === 'Commercial';
  const savingsPMPM = c.costTarget - c.costPMPM;
  const savingsAnnual = savingsPMPM * c.members * 12;

  // Quality breakdown
  const totalWt = measures.reduce((a,m)=>a+m.weight,0);
  const buckets = { on_track:[], at_risk:[], below_target:[] };
  measures.forEach(m => buckets[getMeasureStatus(m)].push(m));
  const wtPct = arr => arr.reduce((a,m)=>a+m.weight,0) / totalWt;
  const qualityPool = c.incentivePool * QUALITY_WEIGHT;
  const qualityEarned = arr => qualityPool * wtPct(arr); // on-track earns full
  const onTrackEarned    = qualityEarned(buckets.on_track);
  const atRiskAtStake    = qualityEarned(buckets.at_risk);
  const belowAtStake     = qualityEarned(buckets.below_target);
  const qualityPctEarned = onTrackEarned / qualityPool * 100;

        <div style={{ fontSize:14, fontWeight:700, color: fav===undefined?T.text:(fav?'#059669':'#dc2626') }}>{value}</div>
        {sub && <div style={{ fontSize:11, color:T.faint, marginTop:1 }}>{sub}</div>}
      </div>

  return <div className="fade-in" style={{ flex:1, overflow:'auto', padding:22 }}>
    {/* Header */}
    <div style={{ background:T.cardBg, borderRadius:12, padding:'14px 22px', marginBottom:16, boxShadow:'0 1px 4px rgba(0,0,0,0.07)', display:'flex', alignItems:'center', justifyContent:'space-between' }}>
      <div>
        <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:4 }}>
          <h1 style={{ fontSize:16, fontWeight:700, color:T.text }}>{c.name}</h1>
          <Badge status={c.status} />
          {c.alerts > 0 && <span style={{ background:'#fef2f2', color:'#dc2626', border:'1px solid #fecaca', borderRadius:6, padding:'2px 8px', fontSize:11, fontWeight:700 }}>⚡ {c.alerts} alerts</span>}
        </div>
        <div style={{ fontSize:12, color:T.muted }}>{c.payer} · {c.type} · {c.period} · {fmtN(c.members)} attributed members</div>

      <div style={{ display:'flex', alignItems:'center', gap:14 }}>
        <button className="btn-base" onClick={()=>setPickerOpen(true)} style={{ background:T.accentLight, color:T.accentText, border:'none', borderRadius:7, padding:'7px 14px', fontSize:12, fontWeight:600, display:'flex', alignItems:'center', gap:6 }}>
          ⇄ Compare with…
        </button>
        <div style={{ textAlign:'right' }}>
          <div style={{ fontSize:10, color:T.faint }}>Period ends</div>
          <div style={{ fontSize:14, fontWeight:700, color:T.text }}>{c.periodEnd}</div>
        </div>
      </div>
    </div>
    {pickerOpen && <ComparePicker excludeIds={[c.id]} sameTypeAs={c.type} onPick={other=>{ setPickerOpen(false); onCompare([c, other]); }} onClose={()=>setPickerOpen(false)} T={T} />}

    {/* HERO: Incentive performance */}
    <div style={{ background:`linear-gradient(135deg, ${T.sidebar} 0%, ${T.accentDark} 100%)`, borderRadius:14, padding:'22px 26px', marginBottom:16, color:'#fff', boxShadow:'0 4px 16px rgba(0,0,0,0.12)' }}>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', gap:24 }}>
        <div style={{ flex:1, minWidth:0 }}>
          <div style={{ fontSize:11, color:'rgba(255,255,255,0.7)', fontWeight:600, textTransform:'uppercase', letterSpacing:0.7, marginBottom:8 }}>Incentive Earned to Date · Provisional estimate</div>
          <div style={{ display:'flex', alignItems:'baseline', gap:14, marginBottom:14 }}>
            <div style={{ fontSize:38, fontWeight:700, lineHeight:1 }}>{fmtM(c.incentiveEarned)}</div>
            <div style={{ fontSize:15, color:'rgba(255,255,255,0.7)' }}>of {fmtM(c.incentivePool)} pool</div>
          </div>
          <div style={{ height:9, background:'rgba(255,255,255,0.18)', borderRadius:5, overflow:'hidden', marginBottom:7 }}>
            <div className="bar-fill" style={{ height:'100%', width:`${earnedPct}%`, background:'#fff', borderRadius:5 }} />
          </div>
          <div style={{ display:'flex', justifyContent:'space-between', fontSize:11, color:'rgba(255,255,255,0.75)' }}>
            <span style={{ fontWeight:600, color:'#fff' }}>{fmtPct(earnedPct)} of pool earned</span>
            <span>{fmtM(c.incentivePool - c.incentiveEarned)} remaining at stake</span>
          </div>
          <div style={{ fontSize:11, color:'rgba(255,255,255,0.75)', marginTop:6 }}>Accrued from current measure performance and cost trend. Not a firm amount: the final incentive is set at year-end reconciliation and may change.</div>
        </div>
        <div style={{ width:1, alignSelf:'stretch', background:'rgba(255,255,255,0.18)' }} />
        <div style={{ width:200, flexShrink:0 }}>
          <div style={{ fontSize:11, color:'rgba(255,255,255,0.7)', fontWeight:600, textTransform:'uppercase', letterSpacing:0.7, marginBottom:10 }}>vs Prior Period</div>
          <div style={{ marginBottom:12 }}>
            <div style={{ fontSize:11, color:'rgba(255,255,255,0.65)', marginBottom:2 }}>Earned change</div>
            <div style={{ fontSize:18, fontWeight:700, color: s.earnedCur >= s.earnedPrev ? '#86efac' : '#fca5a5' }}>
              {s.earnedCur >= s.earnedPrev ? '▲' : '▼'} {fmtM(Math.abs(s.earnedCur - s.earnedPrev))}
            </div>
          </div>
          <div>
            <div style={{ fontSize:11, color:'rgba(255,255,255,0.65)', marginBottom:2 }}>Pool change</div>
            <div style={{ fontSize:18, fontWeight:700, color: s.poolCur >= s.poolPrev ? '#86efac' : '#fca5a5' }}>
              {s.poolCur >= s.poolPrev ? '▲' : '▼'} {fmtM(Math.abs(s.poolCur - s.poolPrev))}
            </div>
          </div>
        </div>
      </div>
    </div>

    {/* Incentive Earned Breakdown */}
    {(() => {
      const fin = getFinancials(c);
      return <div style={{ background:T.cardBg, borderRadius:12, padding:'18px 22px', marginBottom:14, boxShadow:'0 1px 4px rgba(0,0,0,0.07)' }}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:14 }}>
          <div style={{ fontSize:14, fontWeight:700, color:T.text }}>Incentive Earned Breakdown <span style={{ fontSize:11, fontWeight:600, color:T.muted }}>· provisional, subject to year-end reconciliation</span></div>
          <div style={{ fontSize:11, color:T.muted }}>{fmtM(c.incentiveEarned)} of {fmtM(c.incentivePool)} pool · {fmtPct(c.incentiveEarned/c.incentivePool*100)}</div>
        </div>
        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:14, marginBottom:14 }}>
          {fin.incentiveRows.map(row => (
            <div key={row.label} style={{ background:T.bg, borderRadius:8, padding:'12px 14px' }}>
              <div style={{ fontSize:11, color:T.muted, fontWeight:600, marginBottom:6 }}>{row.label}</div>
              <div style={{ display:'flex', alignItems:'baseline', gap:6, marginBottom:6 }}>
                <span style={{ fontSize:17, fontWeight:700, color:T.text }}>{fmtM(row.earned)}</span>
                <span style={{ fontSize:11, color:T.faint }}>of {fmtM(row.pool)}</span>
              </div>
              <div style={{ height:6, background:'#e2e8f0', borderRadius:3, overflow:'hidden' }}>
                <div className="bar-fill" style={{ height:'100%', width:`${row.earned/row.pool*100}%`, background:T.accent, opacity:0.85 }} />
              </div>
              <div style={{ fontSize:10, color:T.faint, marginTop:4, fontWeight:600 }}>{fmtPct(row.earned/row.pool*100)} earned</div>
            </div>
          ))}
        </div>
        <div style={{ borderTop:`1px solid ${T.border}`, paddingTop:12 }}>
          <div style={{ fontSize:11, color:T.muted, marginBottom:8, fontWeight:600, textTransform:'uppercase', letterSpacing:0.5 }}>Full-Year Projection</div>
          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:10 }}>
            {[['Optimistic',1.12,'#10b981','#f0fdf4'],['Base Case',1.04,T.text,T.bg],['Conservative',0.93,'#ef4444','#fef2f2']].map(([l,k,tc,bc])=>
              <div key={l} style={{ background:bc, borderRadius:8, padding:'10px 12px', textAlign:'center' }}>
                <div style={{ fontSize:16, fontWeight:700, color:tc }}>{fmtM(c.incentiveEarned*k)}</div>
                <div style={{ fontSize:11, color:tc, marginTop:2, fontWeight:500 }}>{l}</div>
              </div>)}
          </div>
        </div>
      </div>;
    })()}

    {/* 3 category cards */}
    <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:14, marginBottom:14 }}>

      {/* 1. MEMBER PANEL */}
      {card('Member Panel', { label:'View members', onClick:()=>onNav('memberpanel') }, <>
        <div style={{ display:'flex', alignItems:'baseline', gap:8, marginBottom:4 }}>
          <div style={{ fontSize:26, fontWeight:700, color:T.text }}>{fmtN(s.membersNow)}</div>
          <div style={{ fontSize:13, fontWeight:600, color: memDelta>=0?'#059669':'#dc2626' }}>
            {memDelta>=0?'▲':'▼'} {fmtN(Math.abs(memDelta))}
          </div>
        </div>
        <div style={{ fontSize:11, color:T.faint, marginBottom:14 }}>vs {fmtN(s.membersPrev)} prior period</div>
        <div style={{ display:'flex', gap:6, marginBottom:14 }}>
          <div style={{ flex:1, background:'#f0fdf4', borderRadius:7, padding:'8px 10px', textAlign:'center' }}>
            <div style={{ fontSize:15, fontWeight:700, color:'#059669' }}>+{fmtN(s.membersAdded)}</div>
            <div style={{ fontSize:9, color:'#065f46', fontWeight:600, textTransform:'uppercase' }}>Added</div>
          </div>
          <div style={{ flex:1, background:'#fef2f2', borderRadius:7, padding:'8px 10px', textAlign:'center' }}>
            <div style={{ fontSize:15, fontWeight:700, color:'#dc2626' }}>−{fmtN(s.membersDropped)}</div>
            <div style={{ fontSize:9, color:'#991b1b', fontWeight:600, textTransform:'uppercase' }}>Dropped</div>
          </div>
          <div style={{ flex:1, background:T.bg, borderRadius:7, padding:'8px 10px', textAlign:'center' }}>
            <div style={{ fontSize:15, fontWeight:700, color:T.text }}>{fmtN(s.membersRetained)}</div>
            <div style={{ fontSize:9, color:T.muted, fontWeight:600, textTransform:'uppercase' }}>Retained</div>
          </div>
        </div>
        {!isMSSP && statRow('Capitation impact (annual)', `${capDiff>=0?'+':'−'}${fmtM(Math.abs(capDiff))}`, `vs prior · $${s.capNow}/pm`, capDiff>=0)}
        <div style={{ marginTop:'auto', paddingTop:10, fontSize:11, color:T.muted, fontStyle:'italic', lineHeight:1.4 }}>
          {isMSSP
            ? `Pool calculated from PMPM savings vs $${c.costTarget} target`
            : isMLR
              ? `Pool calculated against ${(s.mlrTarget*100).toFixed(1)}% MLR target`
              : `Pool calculated against $${c.costTarget} PMPM target`}
        </div>
      </>)}

      {/* 2. FINANCIAL PERFORMANCE */}
      {card('Financial Performance', { label:'Detail', onClick:()=>onNav('financial') }, <>
        <div style={{ display:'flex', alignItems:'baseline', gap:8, marginBottom:4 }}>
          <div style={{ fontSize:26, fontWeight:700, color: c.costPMPM<=c.costTarget?'#059669':'#dc2626' }}>${c.costPMPM}</div>
          <div style={{ fontSize:13, color:T.muted }}>PMPM</div>
        </div>
        <div style={{ fontSize:11, color:T.faint, marginBottom:14 }}>vs ${c.costTarget} target ({c.costPMPM<=c.costTarget?'favorable':'unfavorable'} ${Math.abs(c.costPMPM-c.costTarget)}/pm)</div>
        <div style={{ marginBottom:12 }}>
          <div style={{ display:'flex', justifyContent:'space-between', fontSize:11, color:T.muted, marginBottom:4 }}>
            <span>Medical Spend vs Target</span>
            <span style={{ fontWeight:600, color: c.costPMPM<=c.costTarget?'#059669':'#dc2626' }}>{fmtPct((c.costPMPM-c.costTarget)/c.costTarget*100)}</span>
          </div>
          <div style={{ position:'relative', height:8, background:'#e2e8f0', borderRadius:4 }}>
            <div className="bar-fill" style={{ height:'100%', width:`${Math.min(c.costPMPM/(c.costTarget*1.2)*100,100)}%`, background:c.costPMPM<=c.costTarget?'#10b981':'#ef4444', borderRadius:4 }} />
            <div style={{ position:'absolute', top:-3, left:`${c.costTarget/(c.costTarget*1.2)*100}%`, width:2, height:14, background:'#334155' }} />
          </div>
        </div>
        {statRow('Medical Spend PMPM', `$${c.costPMPM}`, `prior $${s.medSpendPrev} · ${spendDiff>=0?'+':''}$${spendDiff.toFixed(0)}/pm`, spendDiff<=0)}
        {isMSSP
          ? statRow('Savings vs Target', `${savingsPMPM>=0?'+':''}$${savingsPMPM.toFixed(0)}/pm`, `${savingsAnnual>=0?'generates':'erodes'} ${fmtM(Math.abs(savingsAnnual))} annual · drives pool`, savingsPMPM>=0)
          : isMLR
            ? statRow('MLR', `${(s.mlrNow*100).toFixed(1)}%`, `prior ${(s.mlrPrev*100).toFixed(1)}% · target ${(s.mlrTarget*100).toFixed(1)}%`, s.mlrNow<=s.mlrTarget)
            : statRow('Cost vs Target', `${fmtPct((c.costPMPM-c.costTarget)/c.costTarget*100)}`, `${c.costPMPM<=c.costTarget?'under':'over'} budget`, c.costPMPM<=c.costTarget)
        }
      </>)}

      {/* 3. QUALITY SCORE */}
      {card('Quality Score', { label:'Measures', onClick:()=>onNav('measure') }, <>
        <div style={{ display:'flex', alignItems:'baseline', gap:8, marginBottom:4 }}>
          <div style={{ fontSize:26, fontWeight:700, color:T.text }}>{fmtPct(qualityPctEarned)}</div>
          <div style={{ fontSize:13, color:T.muted }}>of quality & utilization pool earned</div>
        </div>
        <div style={{ fontSize:11, color:T.faint, marginBottom:12 }}>{fmtM(onTrackEarned)} secured of {fmtM(qualityPool)} quality & utilization component · {buckets.on_track.length} of {measures.length} measures achieved</div>
        {/* Stacked bar */}
        <div style={{ display:'flex', height:10, borderRadius:5, overflow:'hidden', marginBottom:6, background:'#e2e8f0' }}>
          <div className="bar-fill" style={{ width:`${wtPct(buckets.on_track)*100}%`, background:'#10b981' }} title="On Track" />
          <div className="bar-fill" style={{ width:`${wtPct(buckets.at_risk)*100}%`, background:'#f59e0b' }} title="At Risk" />
          <div className="bar-fill" style={{ width:`${wtPct(buckets.below_target)*100}%`, background:'#ef4444' }} title="Below Target" />
        </div>
        <div style={{ display:'flex', flexDirection:'column', gap:8, marginTop:10 }}>
          {[
            { key:'on_track',     label:'Hitting target',  arr:buckets.on_track,     amt:onTrackEarned,    sub:'secured' },
            { key:'at_risk',      label:'Close · needs focus', arr:buckets.at_risk,  amt:atRiskAtStake,   sub:'at stake' },
            { key:'below_target', label:'Below target · significant work', arr:buckets.below_target, amt:belowAtStake, sub:'at risk' },
          ].map(b => {
            const st = STATUS[b.key];
            return <div key={b.key} style={{ display:'flex', alignItems:'center', gap:10, padding:'7px 10px', background:st.bg, borderRadius:7 }}>
              <div style={{ width:24, height:24, borderRadius:'50%', background:'#fff', display:'flex', alignItems:'center', justifyContent:'center', fontSize:12, fontWeight:700, color:st.text, flexShrink:0 }}>{b.arr.length}</div>
              <div style={{ flex:1, minWidth:0 }}>
                <div style={{ fontSize:11, fontWeight:600, color:st.text }}>{b.label}</div>
                <div style={{ fontSize:10, color:st.text, opacity:0.75 }}>{+(wtPct(b.arr)*100).toFixed(1)}% of pool · {fmtM(b.amt)} {b.sub}</div>
              </div>
            </div>;
          })}
        </div>
      </>)}
    </div>

    {/* Risk Adjustment & Coding band */}
    {(() => {
      const mvmt = getRafMovement(c);
      const suspects = getSuspectConditions(c);
      const totalSuspect = suspects.reduce((s,h)=>s+h.suspectMembers,0);
      const totalOpp = suspects.reduce((s,h)=>s+h.annualOpp,0);
      const rafDelta = mvmt.rafCur - mvmt.rafPrior;
      const rafPct = rafDelta/mvmt.rafPrior*100;
      const totalDrop = mvmt.dropMajor + mvmt.dropMinor;
      const revAtRisk = rafDelta * mvmt.capPMPM * 12 * c.members;
      const topHcc = suspects[0];
      return <div style={{ background:T.cardBg, borderRadius:12, padding:'18px 22px', marginBottom:14, boxShadow:'0 1px 4px rgba(0,0,0,0.07)', borderLeft:'3px solid #8b5cf6' }}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-end', marginBottom:14 }}>
          <div>
            <div style={{ fontSize:14, fontWeight:700, color:T.text }}>Risk Adjustment &amp; Coding</div>
            <div style={{ fontSize:12, color:T.muted, marginTop:2 }}>{hccModelLabel(c)} model · panel-average RAF and open coding gaps.</div>
          </div>
          <button className="btn-base" onClick={()=>onNav('risk')} style={{ background:T.accentLight, color:T.accentText, border:'none', borderRadius:7, padding:'7px 14px', fontSize:12, fontWeight:600 }}>View detail →</button>
        </div>
        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr 1fr 1fr', gap:12 }}>
          {/* Avg RAF */}
          <div style={{ background:T.bg, borderRadius:9, padding:'12px 14px' }}>
            <div style={{ fontSize:10, color:T.faint, fontWeight:600, textTransform:'uppercase', letterSpacing:0.5, marginBottom:6 }}>Avg RAF (current)</div>
            <div style={{ fontSize:22, fontWeight:700, color:T.text, lineHeight:1.1 }}>{mvmt.rafCur.toFixed(3)}</div>
            <div style={{ fontSize:11, color:T.faint, marginTop:3 }}>Prior {mvmt.rafPrior.toFixed(3)}</div>
            <div style={{ marginTop:6 }}>
              <span style={{ display:'inline-flex', alignItems:'center', gap:3, background: rafDelta>=0?'#f0fdf4':'#fef2f2', color: rafDelta>=0?'#059669':'#dc2626', borderRadius:6, padding:'2px 8px', fontSize:11, fontWeight:700 }}>
                {rafDelta>=0?'▲':'▼'} {Math.abs(rafDelta).toFixed(3)} ({rafPct>=0?'+':''}{rafPct.toFixed(1)}%)
              </span>
            </div>
          </div>
          {/* Score drops */}
          <div style={{ background:T.bg, borderRadius:9, padding:'12px 14px' }}>
            <div style={{ fontSize:10, color:T.faint, fontWeight:600, textTransform:'uppercase', letterSpacing:0.5, marginBottom:6 }}>Score Drops (YoY)</div>
            <div style={{ fontSize:22, fontWeight:700, color:T.text, lineHeight:1.1 }}>{fmtN(totalDrop)}</div>
            <div style={{ fontSize:11, color:T.faint, marginTop:3 }}>{(totalDrop/c.members*100).toFixed(0)}% of panel</div>
            <div style={{ display:'flex', gap:8, marginTop:6, fontSize:10 }}>
              <span style={{ color:'#dc2626', fontWeight:600 }}>● Major {fmtN(mvmt.dropMajor)}</span>
              <span style={{ color:'#f59e0b', fontWeight:600 }}>● Minor {fmtN(mvmt.dropMinor)}</span>
            </div>
          </div>
          {/* Suspect HCCs */}
          <div style={{ background:T.bg, borderRadius:9, padding:'12px 14px' }}>
            <div style={{ fontSize:10, color:T.faint, fontWeight:600, textTransform:'uppercase', letterSpacing:0.5, marginBottom:6 }}>Open Suspect HCCs</div>
            <div style={{ fontSize:22, fontWeight:700, color:T.text, lineHeight:1.1 }}>{fmtN(totalSuspect)}</div>
            <div style={{ fontSize:11, color:T.faint, marginTop:3 }}>Across {suspects.length} HCC categories</div>
            <div style={{ fontSize:10, color:T.muted, marginTop:6 }}>Top: <strong style={{ color:'#6d28d9' }}>{topHcc.code}</strong> · {fmtN(topHcc.suspectMembers)} members</div>
          </div>
          {/* Recapture opportunity */}
          <div style={{ background:'linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%)', borderRadius:9, padding:'12px 14px', border:'1px solid #bbf7d0' }}>
            <div style={{ fontSize:10, color:'#065f46', fontWeight:700, textTransform:'uppercase', letterSpacing:0.5, marginBottom:6 }}>Recapturable Revenue</div>
            <div style={{ fontSize:22, fontWeight:700, color:'#065f46', lineHeight:1.1 }}>{fmtM(totalOpp)}</div>
            <div style={{ fontSize:11, color:'#047857', marginTop:3 }}>Annual · close suspect HCCs</div>
            <div style={{ fontSize:10, color:'#047857', marginTop:6 }}>vs {fmtM(Math.abs(revAtRisk))} at risk from drop</div>
          </div>
        </div>
      </div>;
    })()}

    {/* Alerts */}
    {c.alerts > 0 && <div style={{ background:'#fffbeb', borderRadius:10, padding:'12px 16px', border:'1px solid #fde68a' }}>
      <div style={{ fontSize:12, fontWeight:700, color:'#92400e', marginBottom:8 }}>⚡ {c.alerts} Active Alerts</div>
      <div style={{ display:'flex', gap:6, flexWrap:'wrap' }}>
        {c.alertList.map((a, i) => (
          <span key={i} style={{ background:'#fff', border:`1px solid ${a.sev==='critical'?'#fecaca':'#fde68a'}`, borderRadius:6, padding:'4px 10px', fontSize:11, color: a.sev==='critical'?'#991b1b':'#92400e' }}>{a.short}</span>
        ))}
      </div>
    </div>}
  </div>;
};

// ─── QUALITY FORECAST PAGE (Forecast Cockpit wrapper) ─────────────
// Hosts the QualityForecastView component from quality-forecast.jsx.
// Syncs the demo CONTRACT object (defined in quality-shared.jsx) with the
// currently-selected contract so the header reflects the active selection.
const QualityForecastPage = ({ c, T }) => {
  if (window.CONTRACT) {
    window.CONTRACT.name   = c.name;
    window.CONTRACT.payer  = c.payer;
    window.CONTRACT.period = c.period;
  }
  const Forecast = window.QualityForecastView;
  if (!Forecast) {
    return <div style={{ padding:40, color:T.muted, fontSize:13 }}>Loading Forecast Cockpit…</div>;
  }
  return (
    <div className="fade-in" style={{ flex:1, overflow:'auto' }}>
      <Forecast />
    </div>
  );
};

// ─── MEASURE DRILLDOWN ────────────────────────────────────────────
const MeasureDrilldown = ({ c, T }) => {
  const measures = getMeasures(c.id);
  const [cat, setCat] = useState('All');
  const cats = ['All', ...new Set(measures.map(m=>m.category))];
  const shown = cat==='All' ? measures : measures.filter(m=>m.category===cat);
  // Achieved (full weight) or Not Achieved (0) — equal weights
  const totalWt = measures.reduce((s,m) => s + m.weight, 0);
  const score = Math.round(measures.reduce((s,m) => s + (getMeasureStatus(m)==='on_track' ? m.weight : 0), 0) / totalWt * 1000) / 10;
  const met = measures.filter(m=>getMeasureStatus(m)==='on_track').length;

  return <div className="fade-in" style={{ flex:1, overflow:'auto', padding:22 }}>
    <div style={{ display:'flex', gap:12, marginBottom:18 }}>
      <KPI label="Composite Score"     value={`${score}/100`}        sub={`Target: ${c.qualityTarget} (6 of 8 achieved)`}    delta={score-c.qualityTarget}        accent={T.accent}  T={T} />
      <KPI label="Measures Achieved"   value={`${met} / ${measures.length}`} sub="At or better than target"  accent="#10b981"  T={T} />
      <KPI label="Weighted Pts Earned" value={`${score} pts`}        sub="12.5 pts per measure · max 100"                                       accent="#8b5cf6"   T={T} />
      <KPI label="Quality Incentive"   value={fmtM(c.incentivePool*QU_SHARE*(score/100))} sub="Quality & utilization component" accent="#f59e0b"  T={T} />
    </div>

    {/* Category tabs */}
    <div style={{ display:'flex', gap:8, marginBottom:14 }}>
      {cats.map(c2 => <button key={c2} className="btn-base" onClick={()=>setCat(c2)} style={{ padding:'6px 14px', borderRadius:7, fontSize:12, fontWeight:600, background:cat===c2?T.accent:'#fff', color:cat===c2?'#fff':T.muted, border:`1px solid ${cat===c2?T.accent:T.border}` }}>{c2}</button>)}
    </div>

    <div style={{ background:T.cardBg, borderRadius:12, boxShadow:'0 1px 4px rgba(0,0,0,0.07)', overflow:'hidden' }}>
      <div style={{ display:'grid', gridTemplateColumns:'minmax(200px,2fr) 110px 100px 90px 90px 85px 80px 80px', padding:'9px 20px', background:'#f8fafc', borderBottom:`1px solid ${T.border}` }}>
        {['Measure','Category','Status','Actual','Target','Benchmark','Trend','Δ Points'].map((h,i)=>
          <div key={i} style={{ fontSize:10, fontWeight:700, color:T.faint, textTransform:'uppercase', letterSpacing:0.6 }}>{h}</div>)}
      </div>
      {shown.map((m,i) => {
        const ms = getMeasureStatus(m);
        const d = m.inverse ? m.target - m.actual : m.actual - m.target;
        return <div key={m.id} style={{ display:'grid', gridTemplateColumns:'minmax(200px,2fr) 110px 100px 90px 90px 85px 80px 80px', padding:'13px 20px', borderBottom:i<shown.length-1?`1px solid #f1f5f9`:'none', alignItems:'center' }}>
          <div>
            <div style={{ fontSize:13, fontWeight:600, color:T.text }}>{m.name}</div>
            <div style={{ marginTop:5 }}><Bar value={m.actual} target={m.target} max={m.inverse?Math.max(m.actual,m.target)*1.2:100} inverse={m.inverse} /></div>
          </div>
          <div style={{ fontSize:12, color:T.muted }}>{m.category}</div>
          <div><Badge status={ms} sm /></div>
          <div style={{ fontSize:13, fontWeight:700, color:STATUS[ms].dot }}>{m.inverse?m.actual.toFixed(1):fmtPct(m.actual)}</div>
          <div style={{ fontSize:13, color:T.muted }}>{m.inverse?m.target.toFixed(1):fmtPct(m.target)}</div>
          <div style={{ fontSize:12, color:T.faint }}>{m.inverse?m.benchmark.toFixed(1):fmtPct(m.benchmark)}</div>

        </div>;

    </div>

};

// ─── MEMBER PANEL DRILLDOWN ───────────────────────────────────────
const FIRST_NAMES = ['James','Maria','Robert','Linda','Michael','Patricia','David','Jennifer','William','Elizabeth','Richard','Barbara','Joseph','Susan','Thomas','Jessica','Charles','Sarah','Christopher','Karen','Daniel','Nancy','Matthew','Lisa','Anthony','Margaret','Mark','Betty','Donald','Sandra','Steven','Ashley','Paul','Kimberly','Andrew','Emily','Joshua','Donna','Kenneth','Michelle'];
const LAST_NAMES = ['Smith','Johnson','Williams','Brown','Jones','Garcia','Miller','Davis','Rodriguez','Martinez','Hernandez','Lopez','Gonzalez','Wilson','Anderson','Thomas','Taylor','Moore','Jackson','Martin','Lee','Perez','Thompson','White','Harris','Sanchez','Clark','Ramirez','Lewis','Robinson','Walker','Young','Allen','King','Wright','Scott','Torres','Nguyen','Hill','Flores'];
const BENEFIT_CATEGORIES = {
  MSSP:       ['Medicare ACO Track 1','Medicare ACO Enhanced','Skilled Nursing Benefit','Chronic Care Management'],
  Commercial: ['PPO Standard','PPO Plus','HMO Choice','HMO Premier','HSA Compatible'],
  BPCI:       ['CHF Episode','Joint Replacement','Cardiac Episode','Pneumonia Episode'],
  Bundled:    ['Hip Replacement','Knee Replacement','Spinal Fusion','Cardiac Bundle'],
};
const hash = (s) => { let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619);} return Math.abs(h); };
// Legacy getMemberPanel — used by getRiskRows; returns a static year-end snapshot
const getMemberPanel = (c) => {
  const cats = BENEFIT_CATEGORIES[c.type] || ['Standard','Premium'];
  const s = getExecSummary(c);
  const total = 24;
  const totalReal = s.membersAdded + s.membersDropped + s.membersRetained;
  const nAdded   = Math.max(2, Math.round(s.membersAdded   / totalReal * total));
  const nDropped = Math.max(2, Math.round(s.membersDropped / totalReal * total));
  const list = [];
  for (let i=0;i<total;i++){
    const seed = hash(c.id + ':' + i);
    const fn = FIRST_NAMES[seed % FIRST_NAMES.length];
    const ln = LAST_NAMES[(seed >> 8) % LAST_NAMES.length];
    const cat = cats[(seed >> 16) % cats.length];
    let status;
    if (i < nAdded) status = 'added';
    else if (i < nAdded + nDropped) status = 'dropped';
    else status = 'retained';
    const cap = Math.round(s.capNow * (0.78 + ((seed % 100)/100) * 0.42));
    const rs = +(0.55 + ((seed >> 4) % 175) / 100).toFixed(2);
    const memberId = 'M' + String(10000 + (seed % 89999));
    const tenure = ((seed >> 12) % 96) + 1;
    list.push({ id: memberId, name: `${fn} ${ln}`, benefit: cat, status, cap, riskScore: rs, tenure });
  }
  return list;
};

// Monthly member panel — each member has a stable add/drop month lifecycle
const PANEL_MONTHS = [
  { label:'Jan 2025', idx:0 }, { label:'Feb 2025', idx:1 }, { label:'Mar 2025', idx:2 },
  { label:'Apr 2025', idx:3 }, { label:'May 2025', idx:4 }, { label:'Jun 2025', idx:5 },
];

const getMemberPool = (c) => {
  const cats = BENEFIT_CATEGORIES[c.type] || ['Standard','Premium'];
  const capBase = CAPITATION[c.id] || 145;
  const POOL = 52;
  return Array.from({ length: POOL }, (_, i) => {
    const seed = hash(c.id + ':pool:' + i);
    const fn  = FIRST_NAMES[seed % FIRST_NAMES.length];
    const ln  = LAST_NAMES[(seed >> 8) % LAST_NAMES.length];
    const cat = cats[(seed >> 16) % cats.length];
    const rs  = +(0.55 + ((seed >> 4) % 175) / 100).toFixed(2);
    const memberId = 'M' + String(10000 + (seed % 89999));
    const tenure   = ((seed >> 12) % 96) + 1;
    // Lifecycle bucket
    const lifeSeed = (seed >> 20) % 100;
    let addMonth = 0, dropMonth = null;
    if (lifeSeed < 52) {
      // Base: present Jan–Jun, retained throughout
      addMonth = 0;
    } else if (lifeSeed < 72) {
      // Joined during the year
      addMonth = 1 + ((seed >> 24) % 5);
    } else if (lifeSeed < 87) {
      // Dropped during the year (was present from Jan)
      addMonth = 0;
      dropMonth = 1 + ((seed >> 24) % 5);
    } else {
      // Added then dropped (churn)
      addMonth  = 1 + ((seed >> 24) % 3);
      dropMonth = Math.min(5, addMonth + 1 + ((seed >> 28) % 2));
    }
    // Capitation varies slightly each month (plan adjustments, tier changes)
    const capMonthly = (mo) => Math.round(
      capBase * (0.85 + (((hash(c.id+':cap:'+i+':'+mo)) % 30) / 100) * 0.30)
    );
    return { id:memberId, name:`${fn} ${ln}`, benefit:cat, riskScore:rs, tenure, addMonth, dropMonth, capMonthly };
  });
};

const getMemberPanelByMonth = (c, monthIdx) => {
  return getMemberPool(c)
    .filter(m => m.addMonth <= monthIdx && (m.dropMonth === null || m.dropMonth >= monthIdx))
    .map(m => ({
      ...m,
      cap: m.capMonthly(monthIdx),
      status: m.addMonth === monthIdx ? 'added'
            : (m.dropMonth === monthIdx ? 'dropped' : 'retained'),
    }));
};

// ─── RISK ADJUSTMENT HELPERS ──────────────────────────────────────
const getSuspectConditions = (c) => hccLibraryFor(c).map((hcc) => {
  const seed = hash(c.id + ':hcc:' + hcc.idx);
  const variance = 0.72 + ((seed % 100)/100) * 0.55;          // 0.72–1.27
  const prev = hcc.prevalence * variance;
  const eligible = Math.round(c.members * prev);
  const capture = Math.max(0.30, Math.min(0.78, hcc.captureRate + (((seed >> 7) % 30) - 15)/100));
  const suspectMembers = Math.max(1, Math.round(eligible * (1 - capture)));
  const capRev = (CAPITATION[c.id] || 145);
  const revPerMember = Math.round(hcc.baseRaf * capRev * 12);
  const annualOpp = suspectMembers * revPerMember;
  return { ...hcc, eligible, suspectMembers, captureRate: capture, revPerMember, annualOpp, prevalence: prev };
}).sort((a,b)=>b.annualOpp-a.annualOpp);

const getRafMovement = (c) => {
  const r = RISK_PROFILE[c.id] || { rafCur:1.0, rafPrior:1.0, capPMPM:CAPITATION[c.id]||145 };
  const seed = hash(c.id + ':raf');
  const dropMajor = Math.round(c.members * (0.045 + ((seed % 30)/100) * 0.05));        //  ~4.5–9.5%
  const dropMinor = Math.round(c.members * (0.14  + ((seed >> 4) % 40)/100 * 0.06));   //  ~14–20%
  const increased = Math.round(c.members * (0.18  + ((seed >> 8) % 30)/100 * 0.06));   //  ~18–24%
  const stable    = Math.max(0, c.members - dropMajor - dropMinor - increased);
  return { ...r, dropMajor, dropMinor, stable, increased };
};

// Member-level risk rows: enrich panel members with prior-year RAF & suspect HCC list.
const getMemberRiskRows = (c) => {
  const panel = getMemberPanel(c).filter(m => m.status !== 'dropped');
  const cap   = CAPITATION[c.id] || 145;
  return panel.map(m => {
    const seed = hash(c.id + ':rsk:' + m.id);
    // Distribution: ~55% drop, ~45% stable/increase
    const change = -0.55 + ((seed % 100)/100) * 0.78;             // −0.55 .. +0.23
    const priorRaf = +(Math.max(0.4, m.riskScore - change)).toFixed(2);
    const numSus = ((seed >> 5) % 4);                              // 0–3 suspect HCCs
    const hccs = [];
    const lib = hccLibraryFor(c);
    for (let j = 0; j < numSus; j++) {
      const idx = ((seed >> (j * 3 + 2)) % lib.length);
      const hcc = lib[idx];
      if (!hccs.some(h => h.code === hcc.code)) hccs.push(hcc);
    }
    const recaptureOpp = hccs.reduce((s, h) => s + h.baseRaf, 0) * cap * 12;
    const revImpact = change * cap * 12;
    return { ...m, priorRaf, rafChange: change, hccs, recaptureOpp, revImpact };
  });
};

// ─── PROVIDER GROUPS (risk-adjusted cost performance) ─────────────
const PG_NAMES = [
  ['North Bay Medical Associates', 'Multi-specialty'],
  ['Bayside Family Health',        'Family Practice'],
  ['Summit Internal Medicine',     'Internal Medicine'],
  ['Coastal Care Network',         'Multi-specialty'],
  ['Greenfield Primary Care',      'Family Practice'],
  ['Cedar Park Physicians',        'Internal Medicine'],
  ['Riverside Medical Group',      'Multi-specialty'],
  ['Highland Health Partners',     'Multi-specialty'],
  ['Meridian Medical Center',      'Multi-specialty'],
  ['Westgate Family Practice',     'Family Practice'],
];

const getProviderGroups = (c) => {
  const baseRaf = (RISK_PROFILE[c.id] || {}).rafCur || 1.0;

  // Panel shares: each group gets 0.6–1.8× weight then normalize
  const shares = PG_NAMES.map((_,i) => 0.6 + (hash(c.id+':pg-sh:'+i) % 100) / 100 * 1.2);
  const totalShare = shares.reduce((a,b)=>a+b,0);

  const groups = PG_NAMES.map(([name, type], i) => {
    const seed = hash(c.id+':pg:'+i);
    const panel = Math.max(60, Math.round(c.members * shares[i] / totalShare));
    // RAF varies ±20% around contract baseline
    const rafJ = ((seed % 100) - 50) / 100;                  // −0.50 .. +0.50
    const avgRaf = +(baseRaf * (1 + rafJ * 0.20)).toFixed(3);
    // Raw PMPM varies ±22%, partially correlated with RAF (sicker → costlier, but with noise)
    const pmpmJ = (((seed >> 6) % 100) - 50) / 100;           // independent component
    const rawPMPM = Math.round(c.costPMPM * (1 + pmpmJ * 0.18 + rafJ * 0.10));
    // Risk-adjusted PMPM: normalize to the contract's baseline RAF
    const riskAdjPMPM = Math.round(rawPMPM * baseRaf / avgRaf);
    // Secondary KPIs
    const ed1k     = Math.max(60,  Math.round(165 + ((seed >> 12) % 90) - 40 + rafJ * 60));
    const admits1k = Math.max(35,  Math.round(85  + ((seed >> 16) % 55) - 22 + rafJ * 50));
    const qScore   = Math.max(46,  Math.min(94, Math.round(71 + ((seed >> 20) % 28) - 12 - pmpmJ * 8)));
    // Service-category breakdown (split rawPMPM with jitter; targets follow contract mix)
    const splits = [
      { name:'Inpatient',        sTarget:0.296, sActual:0.285 },
      { name:'Outpatient',       sTarget:0.329, sActual:0.330 },
      { name:'Professional',     sTarget:0.189, sActual:0.188 },
      { name:'Pharmacy',         sTarget:0.128, sActual:0.130 },
      { name:'Post-Acute Care',  sTarget:0.058, sActual:0.067 },
    ];
    const catBreakdown = splits.map((s, ci) => {
      const cJ = (((seed >> (ci*5+3)) % 40) - 20) / 100;     // ±20% jitter per category
      return {
        name:   s.name,
        actual: Math.round(rawPMPM   * s.sActual * (1 + cJ * 0.35)),
        target: Math.round(c.costTarget * s.sTarget),
      };
    });
    return { id:'pg'+i, name, type, panel, avgRaf, rawPMPM, riskAdjPMPM, ed1k, admits1k, qScore, catBreakdown };
  });

  // Peer median of risk-adj PMPM (panel-weighted)
  const totalPanel = groups.reduce((s,g)=>s+g.panel,0);
  const sorted = [...groups].sort((a,b)=>a.riskAdjPMPM-b.riskAdjPMPM);
  let cum = 0; let peerMedian = sorted[sorted.length>>1].riskAdjPMPM;
  for (const g of sorted) { cum += g.panel; if (cum >= totalPanel/2) { peerMedian = g.riskAdjPMPM; break; } }

  return groups.map(g => ({
    ...g,
    vsTarget: g.riskAdjPMPM - c.costTarget,
    vsPeer:   g.riskAdjPMPM - peerMedian,
    peerMedian,
    annualVarVsTarget: (c.costTarget - g.riskAdjPMPM) * g.panel * 12,
    annualVarVsPeer:   (peerMedian   - g.riskAdjPMPM) * g.panel * 12,
  }));
};

// ─── PROVIDER-GROUP SECTION (used inside Financial Drilldown) ─────
const ProviderGroupSection = ({ c, T }) => {
  const groups = getProviderGroups(c);
  const peerMedian = groups[0].peerMedian;
  const baseRaf = (RISK_PROFILE[c.id] || {}).rafCur || 1.0;
  const [sort, setSort] = useState('vsTarget_desc');  // worst-first by default
  const [expanded, setExpanded] = useState(null);
  const [highlight, setHighlight] = useState(null);

  const sorted = useMemo(() => {
    const [key, dir] = sort.split('_');
    const m = dir === 'asc' ? 1 : -1;
    return [...groups].sort((a,b) => {
      const va = a[key], vb = b[key];
      if (typeof va === 'string') return va.localeCompare(vb) * m;
      return (va - vb) * m;
    });
  }, [groups, sort]);

  // Outliers by risk-adj $ variance vs target (annualized, panel-weighted)
  const byAnnual = [...groups].sort((a,b)=>b.annualVarVsTarget - a.annualVarVsTarget);
  const overPerformers  = byAnnual.slice(0, 2);
  const underPerformers = byAnnual.slice(-2).reverse();

  // Scatter chart geometry
  const W = 720, H = 280;
  const padL = 50, padR = 16, padT = 20, padB = 38;

  const xMax = Math.max(...xs) * 1.05;
  const ys = groups.map(g=>g.rawPMPM);
  const yMin = Math.min(...ys, c.costTarget) * 0.85;
  const yMax = Math.max(...ys, c.costTarget) * 1.10;
  const X = v => padL + (v - xMin) / (xMax - xMin) * (W - padL - padR);
  const Y = v => padT + (1 - (v - yMin) / (yMax - yMin)) * (H - padT - padB);
  // Expected (risk-adjusted target) line: PMPM = costTarget * raf/baseRaf

  const radius = g => 6 + Math.sqrt(g.panel / Math.max(...groups.map(x=>x.panel))) * 12;

  const xTicks = [xMin, (xMin+xMax)/2, xMax].map(v => +v.toFixed(2));
  const yTickStep = Math.ceil((yMax - yMin) / 4 / 50) * 50;

  const sortBtn = (key, label) => {

      <span onClick={()=>setSort(key+'_'+(isThis && sort.endsWith('_asc') ? 'desc' : 'asc'))}

        </div>
        {sorted.map((g, i) => {

                  <div style={{ display:'grid', gridTemplateColumns:'1.4fr 1fr', gap:18 }}>

                      </div>

                        <div style={{ fontSize:10, color:T.faint, fontWeight:700, textTransform:'uppercase', letterSpacing:0.5 }}>vs Peer Median</div>
                        <div style={{ fontSize:16, fontWeight:700, color: g.annualVarVsPeer>=0?'#059669':'#dc2626', marginTop:3 }}>
