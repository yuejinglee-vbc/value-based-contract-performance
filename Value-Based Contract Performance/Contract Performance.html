                </div>
                <div onClick={()=>setExpanded(isExp?null:o.id)} style={{ cursor:'pointer' }}>
                  <StackedBar perContract={o.perContract} total={o.totalDollars} w={170} />
                </div>
                <div onClick={()=>setExpanded(isExp?null:o.id)} style={{ cursor:'pointer', fontSize:12, color:T.text, textAlign:'right' }}>{fmtN(o.totalMembers)}</div>
                <div onClick={()=>setExpanded(isExp?null:o.id)} style={{ cursor:'pointer', fontSize:12, fontWeight:600, color: OPP_EFFORT_STYLE[o.effort]?.color || T.muted }}>{o.effort}</div>
                <div onClick={()=>setExpanded(isExp?null:o.id)} style={{ cursor:'pointer', fontSize:12, color:T.muted }}>{o.timeline}</div>
                <div onClick={()=>setExpanded(isExp?null:o.id)} style={{ cursor:'pointer', fontSize:12, color:T.muted }}>{o.owner}</div>
                <div style={{ textAlign:'center' }} onClick={e=>e.stopPropagation()}>
                  <button onClick={()=>toggleScenario(o.id)} className="btn-base" style={{ background: inScn ? '#6d28d9' : 'transparent', color: inScn ? '#fff' : '#6d28d9', border:`1px solid #6d28d9`, padding:'3px 9px', borderRadius:12, fontSize:10, fontWeight:700, whiteSpace:'nowrap' }}>{inScn ? '✓ In' : '+ Add'}</button>
                </div>
                <div onClick={()=>setExpanded(isExp?null:o.id)} style={{ cursor:'pointer', color:T.faint, textAlign:'center', fontSize:13, transform:isExp?'rotate(180deg)':'none', transition:'transform .15s' }}>▾</div>
              </div>

              {/* Expanded — per-contract breakdown */}
              {isExp && (
                <div style={{ background:'#f8fafc', padding:'16px 22px 20px', borderBottom: i<visible.length-1?`1px solid ${T.border}`:'none' }}>
                  <div style={{ display:'grid', gridTemplateColumns:'1.6fr 1fr', gap:18 }}>
                    {/* Per-contract list */}
                    <div>
                      <div style={{ fontSize:11, fontWeight:700, color:T.faint, textTransform:'uppercase', letterSpacing:0.5, marginBottom:8 }}>Per-contract impact</div>
                      <div style={{ background:T.cardBg, borderRadius:8, border:`1px solid ${T.border}`, overflow:'hidden' }}>
                        {o.perContract.sort((a,b)=>b.totalDollars-a.totalDollars).map((p, pi) => {
                          const pct = p.totalDollars / o.totalDollars * 100;
                          return (
                            <div key={pi} className="row-hover" onClick={()=>onSelectContract(p.contract)} style={{ display:'grid', gridTemplateColumns:'12px minmax(180px,2fr) 110px 100px 110px 30px', columnGap:10, padding:'10px 14px', borderBottom: pi<o.perContract.length-1?`1px solid #f1f5f9`:'none', alignItems:'center', cursor:'pointer' }}>
                              <div style={{ width:8, height:8, borderRadius:'50%', background:CONTRACT_COLOR[p.contract.id] || T.muted }} />
                              <div>
                                <div style={{ fontSize:12, fontWeight:600, color:T.text, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{p.contract.name}</div>
                                <div style={{ fontSize:10, color:T.faint }}>{p.contract.payer} · {p.contract.type}</div>
                              </div>
                              <div style={{ fontSize:13, fontWeight:700, color:T.text, textAlign:'right' }}>{fmtM(p.totalDollars)}</div>
                              <div style={{ fontSize:11, color:T.muted, textAlign:'right' }}>{fmtN(p.membersImpacted)} mbrs</div>
                              <div style={{ display:'flex', alignItems:'center', gap:6 }}>
                                <div style={{ flex:1, height:5, background:'#e2e8f0', borderRadius:3 }}>
                                  <div style={{ width:`${pct}%`, height:'100%', background:CONTRACT_COLOR[p.contract.id] || T.muted, borderRadius:3 }} />
                                </div>
                                <span style={{ fontSize:10, color:T.faint, minWidth:30, textAlign:'right' }}>{pct.toFixed(0)}%</span>
                              </div>
                              <div style={{ color:T.accent, textAlign:'center', fontSize:12, fontWeight:600 }}>↗</div>
                            </div>
                          );
                        })}
                        {o.perContract.length === 0 && (
                          <div style={{ padding:'10px 14px', fontSize:12, color:T.muted }}>No contract can reach target on this measure this period.</div>
                        )}
                      </div>
                      {o.unreachable.length > 0 && <>
                        <div style={{ fontSize:11, fontWeight:700, color:T.faint, textTransform:'uppercase', letterSpacing:0.5, margin:'14px 0 8px' }}>Quality target not reachable this period · $0 quality incentive</div>
                        <div style={{ background:T.cardBg, borderRadius:8, border:`1px solid ${T.border}`, overflow:'hidden' }}>
                          {o.unreachable.map((p, pi) => {
                            const g = p.qualityGap;
                            const unit = g.name.includes('per 1K') ? '' : '%';
                            return (
                              <button type="button" key={pi} className="row-hover" onClick={()=>onSelectContract(p.contract)} style={{ display:'grid', width:'100%', textAlign:'left', background:'none', border:'none', fontFamily:'inherit', gridTemplateColumns:'12px minmax(180px,2fr) minmax(200px,1.6fr) 60px', columnGap:10, padding:'10px 14px', borderBottom: pi<o.unreachable.length-1?`1px solid #f1f5f9`:'none', alignItems:'center', cursor:'pointer' }}>
                                <span style={{ width:8, height:8, borderRadius:'50%', background:CONTRACT_COLOR[p.contract.id] || T.muted }} />
                                <span>
                                  <span style={{ display:'block', fontSize:12, fontWeight:600, color:T.text, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{p.contract.name}</span>
                                  <span style={{ display:'block', fontSize:10, color:T.muted }}>{p.contract.payer} · {p.contract.type}</span>
                                </span>
                                <span style={{ fontSize:11, color:T.muted }}>Now {g.current}{unit} · ceiling {g.ceiling}{unit} · target {g.target}{unit}</span>
                                <span style={{ fontSize:13, fontWeight:700, color:T.muted, textAlign:'right' }}>$0</span>
                              </button>
                            );
                          })}
                        </div>
                      </>}
                    </div>

                    {/* Right pane: summary + drivers */}
                    <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
                      <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:8 }}>
                        <div style={{ background:T.cardBg, borderRadius:7, padding:'10px 12px', border:`1px solid ${T.border}` }}>
                          <div style={{ fontSize:10, color:T.faint, fontWeight:700, textTransform:'uppercase', letterSpacing:0.5 }}>Total impact</div>
                          <div style={{ fontSize:18, fontWeight:700, color:T.text, marginTop:3 }}>{fmtM(o.totalDollars)}</div>
                          {o.type === 'Mixed' && <div style={{ fontSize:10, color:T.muted, marginTop:2 }}>Quality {fmtM(o.qualityTotal)} · Cost {fmtM(o.costTotal)}</div>}
                        </div>
                        <div style={{ background:T.cardBg, borderRadius:7, padding:'10px 12px', border:`1px solid ${T.border}` }}>
                          <div style={{ fontSize:10, color:T.faint, fontWeight:700, textTransform:'uppercase', letterSpacing:0.5 }}>Members touched</div>
                          <div style={{ fontSize:18, fontWeight:700, color:T.text, marginTop:3 }}>{fmtN(o.totalMembers)}</div>
                          <div style={{ fontSize:10, color:T.muted, marginTop:2 }}>across {o.contractCount} contracts</div>
                        </div>
                        <div style={{ background:T.cardBg, borderRadius:7, padding:'10px 12px', border:`1px solid ${T.border}` }}>
                          <div style={{ fontSize:10, color:T.faint, fontWeight:700, textTransform:'uppercase', letterSpacing:0.5 }}>Effort / timeline</div>
                          <div style={{ fontSize:14, fontWeight:700, color: OPP_EFFORT_STYLE[o.effort]?.color || T.text, marginTop:3 }}>{o.effort} · {o.timeline}</div>
                          <div style={{ fontSize:10, color:T.muted, marginTop:2 }}>Owner: {o.owner}</div>
                        </div>
                        <div style={{ background:T.cardBg, borderRadius:7, padding:'10px 12px', border:`1px solid ${T.border}` }}>
                          <div style={{ fontSize:10, color:T.faint, fontWeight:700, textTransform:'uppercase', letterSpacing:0.5 }}>Effort:reward</div>
                          <div style={{ fontSize:18, fontWeight:700, color:'#059669', marginTop:3 }}>
                            {o.effort==='Low' ? '★★★' : o.effort==='Med' ? '★★' : '★'}
                          </div>
                          <div style={{ fontSize:10, color:T.muted, marginTop:2 }}>$/effort ratio</div>
                        </div>
                      </div>

                      {/* Drivers */}
                      <div style={{ background:T.cardBg, borderRadius:7, padding:'12px 14px', border:`1px solid ${T.border}` }}>
                        <div style={{ fontSize:10, color:T.faint, fontWeight:700, textTransform:'uppercase', letterSpacing:0.5, marginBottom:8 }}>Why this intervention works</div>
                        {o.qualityTotal > 0 && o.perContract[0]?.qualityGap && (
                          <div style={{ fontSize:12, color:T.text, lineHeight:1.5, marginBottom:5 }}>
                            <b>Quality:</b> Closes gaps to target on <b>{o.perContract[0].qualityGap.name}</b> (avg gap ≈ {(o.perContract.filter(p=>p.qualityGap).reduce((s,p)=>s+parseFloat(p.qualityGap.gap),0)/o.perContract.filter(p=>p.qualityGap).length).toFixed(1)} pts) across {o.perContract.filter(p=>p.qualityGap).length} contracts.
                          </div>
                        )}
                        {o.costTotal > 0 && (
                          <div style={{ fontSize:12, color:T.text, lineHeight:1.5 }}>
                            <b>Cost:</b> Operational lever in <b>{o.category}</b> — recaptures overspend across {o.perContract.filter(p=>p.costDollars>0).length} contracts where the category runs hot vs target.
                          </div>
                        )}
                      </div>

                      <button onClick={()=>{setSelected(new Set([o.id])); setBulkAction('campaign');}} className="btn-base" style={{ background:T.accent, color:'#fff', border:'none', padding:'9px 14px', borderRadius:7, fontSize:12, fontWeight:600 }}>
                        Build cross-contract campaign for this intervention →
                      </button>
                    </div>
                  </div>
                </div>
              )}
            </React.Fragment>
          );
        })}
        {visible.length === 0 && (
          <div style={{ padding:48, textAlign:'center', color:T.faint, fontSize:13 }}>No opportunities match the current filters.</div>
        )}
      </div>

      {/* Bulk action modal */}
      {bulkAction && (
        <div onClick={()=>setBulkAction(null)} style={{ position:'fixed', inset:0, background:'rgba(15,23,42,0.5)', display:'flex', alignItems:'center', justifyContent:'center', zIndex:1000 }}>
          <div onClick={e=>e.stopPropagation()} className="slide-up" style={{ background:T.cardBg, borderRadius:12, padding:'24px 28px', minWidth:480, maxWidth:560, boxShadow:'0 20px 50px rgba(0,0,0,0.3)' }}>
            <div style={{ fontSize:18, fontWeight:700, color:T.text, marginBottom:6 }}>
              {bulkAction==='campaign'  && 'Enroll in cross-contract campaign'}
              {bulkAction==='initiative'&& 'Create portfolio initiative'}
              {bulkAction==='scenario'  && 'Add to what-if scenario'}
            </div>
            <div style={{ fontSize:13, color:T.muted, marginBottom:18, lineHeight:1.5 }}>
              {bulkAction==='campaign'  && `Single outreach campaign spanning ${selectedContracts.length} contracts and ${selected.size} intervention${selected.size===1?'':'s'}. Members are deduplicated; reporting is rolled up across contracts.`}
              {bulkAction==='initiative'&& `Create a strategic portfolio initiative with owner, milestones, and quarterly progress tracking. Aggregates ${selected.size} intervention${selected.size===1?'':'s'} across ${selectedContracts.length} contracts.`}
              {bulkAction==='scenario'  && `Add these ${selected.size} intervention${selected.size===1?'':'s'} to the what-if forecast scenario. The portfolio incentive forecast will reproject including projected impact.`}
            </div>
            <div style={{ background:T.bg, borderRadius:8, padding:'12px 14px', marginBottom:14 }}>
              <div style={{ fontSize:11, color:T.faint, fontWeight:700, textTransform:'uppercase', letterSpacing:0.5, marginBottom:6 }}>Combined impact</div>
              <div style={{ display:'flex', justifyContent:'space-between', alignItems:'baseline' }}>
                <span style={{ fontSize:24, fontWeight:700, color:T.text }}>{fmtM(selectedSum)}</span>
                <span style={{ fontSize:12, color:T.muted }}>{selected.size} intervention{selected.size===1?'':'s'} · {selectedContracts.length} contracts</span>
              </div>
            </div>
            {bulkAction === 'campaign' && (
              <div>
                <div style={{ fontSize:11, color:T.faint, fontWeight:700, textTransform:'uppercase', letterSpacing:0.5, marginBottom:8 }}>Campaign name</div>
                <input defaultValue={`Q3 2026 — Cross-contract ${selectedOpps[0]?.type || ''} push`} style={{ width:'100%', padding:'8px 12px', borderRadius:6, border:`1px solid ${T.border}`, fontSize:13, marginBottom:12 }} />
                <div style={{ fontSize:11, color:T.faint, fontWeight:700, textTransform:'uppercase', letterSpacing:0.5, marginBottom:8 }}>Target contracts</div>
                <div style={{ display:'flex', gap:6, flexWrap:'wrap', marginBottom:14 }}>
                  {selectedContracts.map(cid => {
                    const c = CONTRACTS.find(x => x.id === cid);
                    return <span key={cid} style={{ background:`${CONTRACT_COLOR[cid]}22`, color:CONTRACT_COLOR[cid], fontSize:11, fontWeight:600, padding:'3px 10px', borderRadius:12 }}>● {c.name.split(' — ')[0].split(' ').slice(0,3).join(' ')}</span>;
                  })}
                </div>
              </div>
            )}
            {bulkAction === 'initiative' && (
              <div>
                <div style={{ fontSize:11, color:T.faint, fontWeight:700, textTransform:'uppercase', letterSpacing:0.5, marginBottom:8 }}>Initiative name</div>
                <input defaultValue={`Portfolio Initiative — ${selectedOpps[0]?.category || ''}`} style={{ width:'100%', padding:'8px 12px', borderRadius:6, border:`1px solid ${T.border}`, fontSize:13, marginBottom:12 }} />
                <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12, marginBottom:14 }}>
                  <div>
                    <div style={{ fontSize:11, color:T.faint, fontWeight:700, textTransform:'uppercase', letterSpacing:0.5, marginBottom:6 }}>Executive sponsor</div>
                    <select style={{ width:'100%', padding:'7px 10px', borderRadius:6, border:`1px solid ${T.border}`, fontSize:12 }}>
                      <option>Jordan Davis (Actuarial Lead)</option>
                      <option>Sam Chen (VP Quality)</option>
                      <option>Pat Morgan (CMO)</option>
                    </select>
                  </div>
                  <div>
                    <div style={{ fontSize:11, color:T.faint, fontWeight:700, textTransform:'uppercase', letterSpacing:0.5, marginBottom:6 }}>Review cadence</div>
                    <select style={{ width:'100%', padding:'7px 10px', borderRadius:6, border:`1px solid ${T.border}`, fontSize:12 }}>
                      <option>Monthly</option><option>Quarterly</option><option>Weekly</option>
                    </select>
                  </div>
                </div>
              </div>
            )}
            <div style={{ display:'flex', gap:8 }}>
              <button onClick={()=>{
                  const action = bulkAction;
                  if (action === 'scenario') {
                    const next = new Set(scenarioBag);
                    selectedOpps.forEach(o => next.add(o.id));
                    setScenarioBag(next);
                  }
                  setSnack({
                    msg: action==='campaign' ? `Campaign created — ${selected.size} interventions enrolled across ${selectedContracts.length} contracts`
                       : action==='initiative' ? `Portfolio initiative kicked off — ${selected.size} interventions tracked across ${selectedContracts.length} contracts`
                       : `${selectedOpps.length} interventions added to what-if scenario`,
                  });
                  setBulkAction(null);
                  setSelected(new Set());
                }} className="btn-base" style={{ flex:1, background:T.accent, color:'#fff', border:'none', padding:'10px 14px', borderRadius:7, fontSize:13, fontWeight:700 }}>
                {bulkAction==='campaign'   && 'Launch campaign'}
                {bulkAction==='initiative' && 'Kick off initiative'}
                {bulkAction==='scenario'   && 'Add to scenario'}
              </button>
              <button onClick={()=>setBulkAction(null)} className="btn-base" style={{ background:'transparent', color:T.muted, border:`1px solid ${T.border}`, padding:'10px 14px', borderRadius:7, fontSize:13, fontWeight:600 }}>Cancel</button>
            </div>
          </div>
        </div>
      )}

      {/* Snackbar */}
      {snack && (
        <div className="slide-up" style={{ position:'fixed', bottom:24, left:'50%', transform:'translateX(-50%)', background:'#059669', color:'#fff', padding:'12px 20px', borderRadius:10, boxShadow:'0 10px 30px rgba(0,0,0,0.25)', fontSize:13, fontWeight:600, display:'flex', alignItems:'center', gap:10, zIndex:999 }}>
          <span>✓</span>
          <span>{snack.msg}</span>
          <button onClick={()=>setSnack(null)} style={{ background:'transparent', color:'#fff', border:'none', cursor:'pointer', marginLeft:8, fontSize:14 }}>✕</button>
        </div>
      )}
    </div>
  );
};

// ─── ALERTS PAGE ──────────────────────────────────────────────────
const AlertsPage = ({ onSelectContract, T }) => {
  const allAlerts = CONTRACTS.flatMap(c =>
    c.alertList.map(a => ({ contract:c, sev:a.sev, msg:a.msg, detail:`${c.name} — ${a.short}` })));
  return <div className="fade-in" style={{ flex:1, overflow:'auto', padding:22 }}>
    <div style={{ fontSize:16, fontWeight:700, color:T.text, marginBottom:16 }}>All Alerts <span style={{ color:T.faint, fontSize:13, fontWeight:400 }}>({allAlerts.length} active)</span></div>
    {allAlerts.map((a,i) => (
      <div key={i} className="row-hover" onClick={()=>onSelectContract(a.contract)} style={{ background:T.cardBg, borderRadius:10, padding:'14px 18px', marginBottom:8, boxShadow:'0 1px 3px rgba(0,0,0,0.06)', display:'flex', gap:14, alignItems:'flex-start', borderLeft:`4px solid ${a.sev==='critical'?'#ef4444':'#f59e0b'}` }}>
        <span style={{ fontSize:20 }}>{a.sev==='critical'?'🔴':'🟡'}</span>
        <div style={{ flex:1 }}>
          <div style={{ fontSize:13, fontWeight:600, color:T.text }}>{a.msg}</div>
          <div style={{ fontSize:12, color:T.muted, marginTop:3 }}>{a.detail}</div>
        </div>
        <div><TypeBadge type={a.contract.type} T={T} /></div>
        <div style={{ fontSize:12, color:T.accent, fontWeight:600, whiteSpace:'nowrap' }}>View contract →</div>
      </div>
    ))}
  </div>;
};

// ─── TWEAKS PANEL ─────────────────────────────────────────────────
const TweaksPanel = ({ tweaks, setTweaks, visible }) => {
  const set = (k, v) => {
    const next = { ...tweaks, [k]:v };
    setTweaks(next);
    window.parent.postMessage({ type:'__edit_mode_set_keys', edits:next }, '*');
  };
  return <div style={{ position:'fixed', bottom:20, right:20, width:228, background:'#1a2030', borderRadius:12, padding:16, boxShadow:'0 10px 40px rgba(0,0,0,0.35)', zIndex:1000, transition:'transform 0.22s ease, opacity 0.22s ease', transform:visible?'translateY(0)':'translateY(calc(100% + 28px))', opacity:visible?1:0, pointerEvents:visible?'all':'none' }}>
    <div style={{ fontSize:13, fontWeight:700, color:'#fff', marginBottom:14 }}>Tweaks</div>
    <div style={{ marginBottom:12 }}>
      <div style={{ fontSize:10, color:'#7e93b0', fontWeight:700, textTransform:'uppercase', letterSpacing:0.6, marginBottom:7 }}>Theme</div>
      <div style={{ display:'flex', gap:5 }}>
        {Object.entries(THEMES).map(([key,th]) => (
          <button key={key} className="btn-base" onClick={()=>set('theme',key)} style={{ flex:1, padding:'7px 0', borderRadius:6, background:th.sidebar, border:`2px solid ${tweaks.theme===key?th.accent:'transparent'}`, color:tweaks.theme===key?'#fff':'#7e93b0', fontSize:10, fontWeight:700, cursor:'pointer' }}>{th.label}</button>
        ))}
      </div>
    </div>
    <div style={{ marginBottom:12 }}>
      <div style={{ fontSize:10, color:'#7e93b0', fontWeight:700, textTransform:'uppercase', letterSpacing:0.6, marginBottom:7 }}>Row Density</div>
      <div style={{ display:'flex', gap:5 }}>
        {['standard','compact'].map(d => (
          <button key={d} className="btn-base" onClick={()=>set('density',d)} style={{ flex:1, padding:'7px 0', borderRadius:6, background:tweaks.density===d?'#3b82f6':'#2a3448', border:'none', color:'#fff', fontSize:11, fontWeight:600, textTransform:'capitalize', cursor:'pointer' }}>{d}</button>
        ))}
      </div>
    </div>
    <div>
      <div style={{ fontSize:10, color:'#7e93b0', fontWeight:700, textTransform:'uppercase', letterSpacing:0.6, marginBottom:7 }}>Trend Sparklines</div>
      <div style={{ display:'flex', gap:5 }}>
        {['bars','sparklines'].map(s => (
          <button key={s} className="btn-base" onClick={()=>set('chartStyle',s)} style={{ flex:1, padding:'7px 0', borderRadius:6, background:tweaks.chartStyle===s?'#3b82f6':'#2a3448', border:'none', color:'#fff', fontSize:11, fontWeight:600, textTransform:'capitalize', cursor:'pointer' }}>{s}</button>
        ))}
      </div>
    </div>
  </div>;
};

// ─── APP ──────────────────────────────────────────────────────────
const App = () => {
  const [page, setPage] = useState('list');
  const [contract, setContract] = useState(null);
  const [comparedContracts, setComparedContracts] = useState([]);
  const [lever, setLever] = useState(null);
  const [tweaks, setTweaks] = useState(TWEAK_DEFAULTS);
  const [showTweaks, setShowTweaks] = useState(false);

  useEffect(() => {
    const h = e => {
      if(e.data?.type==='__activate_edit_mode') setShowTweaks(true);
      if(e.data?.type==='__deactivate_edit_mode') setShowTweaks(false);
    };
    window.addEventListener('message', h);
    window.parent.postMessage({ type:'__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', h);
  }, []);

  const selectContract = c => { setContract(c); setPage('dashboard'); };
  const startCompare = list => { setComparedContracts(list); setPage('compare'); };
  const selectLever = lv => { setLever(lv); setPage('lever'); };
  const navTo = dest => setPage(dest);
  useEffect(() => { window.__nav = { setPage, setContract, setLever }; }, []);
  const goList = () => setPage('list');

  const T = THEMES[tweaks.theme];
  const totalAlerts = CONTRACTS.reduce((s,c)=>s+c.alerts,0);
  // Count only interventions that appear on the Opportunities page
  const totalOpps = useMemo(() => getPortfolioOpportunities().length, []);

  const crumbs = [
    { label:'Contracts', onClick: page!=='list' ? () => { setContract(null); goList(); } : null },
    ...(contract && ['dashboard','measure','financial','memberpanel','risk','lever'].includes(page) ? [{ label:contract.name, onClick: page!=='dashboard' ? ()=>setPage('dashboard') : null }] : []),
    ...(page==='measure'     ? [{ label:'Quality Forecast' }] : []),
    ...(page==='financial'   ? [{ label:'Financial Detail' }] : []),
    ...(page==='memberpanel' ? [{ label:'Member Panel' }] : []),
    ...(page==='risk'        ? [{ label:'Risk Adjustment & Coding' }] : []),
    ...(page==='lever'       ? [{ label:'Financial Detail', onClick:()=>setPage('financial') }, { label: lever?.name || 'Operational Lever' }] : []),
    ...(page==='alerts_page'   ? [{ label:'Alerts' }] : []),
    ...(page==='opportunities' ? [{ label:'Opportunities' }] : []),
    ...(page==='compare'     ? [{ label:`Comparison · ${comparedContracts.length} contracts` }] : []),
  ];

  return (
    <div style={{ display:'flex', height:'100vh', overflow:'hidden', fontFamily:"'Inter', -apple-system, sans-serif" }}>
      <Sidebar page={page} setPage={p=>{ if(p==='list') { setContract(null); } setPage(p); }} T={T} totalAlerts={totalAlerts} totalOpps={totalOpps} />
      <div style={{ flex:1, display:'flex', flexDirection:'column', overflow:'hidden', background:T.bg }}>
        <TopBar crumbs={crumbs} totalAlerts={totalAlerts} T={T} />
        {page==='list'       && <ContractList onSelect={selectContract} onCompare={startCompare} T={T} />}
        {page==='dashboard'  && contract && <ContractDashboard c={contract} onNav={navTo} onCompare={startCompare} T={T} />}
        {page==='measure'    && contract && <QualityForecastPage c={contract} T={T} />}
        {page==='financial'  && contract && <FinancialDrilldown c={contract} T={T} onSelectLever={selectLever} />}
        {page==='memberpanel'&& contract && <MemberPanelDrilldown c={contract} T={T} />}
        {page==='risk'       && contract && <RiskCodingDrilldown c={contract} T={T} />}
        {page==='lever'      && contract && lever && <LeverDrilldown c={contract} lever={lever} T={T} onBack={()=>setPage('financial')} />}
        {page==='alerts_page'&& <AlertsPage onSelectContract={selectContract} T={T} />}
        {page==='opportunities' && <OpportunitiesPage onSelectContract={selectContract} T={T} />}
        {page==='compare'    && comparedContracts.length > 0 && <ContractComparison contracts={comparedContracts} setContracts={setComparedContracts} onClose={goList} onOpenContract={selectContract} T={T} />}
      </div>
      <TweaksPanel tweaks={tweaks} setTweaks={setTweaks} visible={showTweaks} />
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
