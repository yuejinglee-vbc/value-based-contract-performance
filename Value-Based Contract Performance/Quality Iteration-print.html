<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Quality · Iteration · Print</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { margin: 0; padding: 0; background: #f3f5f8; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: #0f172a;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  button { font-family: inherit; }

  .page {
    width: 1440px;
    height: 1600px;
    overflow: hidden;
    position: relative;
    background: #eef2f7;
    page-break-after: always;
    break-after: page;
  }
  .page:last-of-type { page-break-after: auto; break-after: auto; }
  .page-label {
    position: absolute;
    top: 14px;
    left: 26px;
    font-size: 10px;
    color: #94a3b8;
    font-weight: 700;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    z-index: 5;
  }

  @page {
    size: 1440px 1600px;
    margin: 0;
  }

  @media print {
    html, body { background: #fff; }
    .page { page-break-after: always; break-after: page; }
    .page:last-of-type { page-break-after: auto; break-after: auto; }
    /* Disable all animations / hover / transitions during print */
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
    }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="quality-shared.jsx"></script>
<script type="text/babel" src="quality-detail.jsx"></script>
<script type="text/babel" src="quality-forecast.jsx"></script>
<script type="text/babel" src="quality-actionboard.jsx"></script>

<script type="text/babel" data-presets="react">
function PrintApp() {
  return (
    <React.Fragment>
      <div className="page">
        <div className="page-label">Quality Component Iteration · Direction A · Forecast Cockpit</div>
        <QualityForecastView />
      </div>
      <div className="page">
        <div className="page-label">Quality Component Iteration · Direction B · Action Plan Board</div>
        <QualityActionBoardView />
      </div>
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<PrintApp />);

// Auto-print once everything has settled (fonts + Babel + a small buffer)
(async () => {
  try {
    if (document.fonts && document.fonts.ready) {
      await document.fonts.ready;
    }
  } catch (e) { /* noop */ }
  // Allow Babel-transpiled scripts and React render to flush.
  setTimeout(() => { window.print(); }, 600);
})();
</script>
</body>
</html>
